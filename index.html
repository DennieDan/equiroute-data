<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JalanLens</title>
    <link rel="stylesheet" href="harvard.css?v=20260731d" />
    <style>
      :root {
        --black: #1e1e1e;
        --crimson: #a51c30;
        --paper: #f3f3f1;
        --serif: 'Libre Baskerville', Baskerville, Georgia, serif;
        --sans: 'Source Sans 3', Arial, Helvetica, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--black);
        font-family: var(--sans);
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(243,243,241,.08), rgba(243,243,241,.34) 58%, rgba(243,243,241,.52)),
          radial-gradient(circle at 70% 24%, rgba(165,28,48,.18), transparent 28%);
      }
      .hero-bg-video {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: saturate(.86) contrast(.98) brightness(1.06);
      }
      main {
        position: relative;
        z-index: 2;
        width: min(1120px, calc(100% - 40px));
        padding-top: 76px;
        text-align: center;
      }
      .homepage-title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(72px, 15vw, 176px);
        font-weight: 400;
        line-height: .86;
        letter-spacing: -.07em;
        color: var(--black);
      }
      .typing-line {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        margin-top: 28px;
        padding: 14px 20px;
        border-top: 4px solid var(--black);
        border-bottom: 1px solid var(--black);
        background: rgba(255,255,255,.58);
        color: var(--black);
        font-size: clamp(20px, 3vw, 34px);
        font-weight: 800;
      }
      #typedText::after {
        content: '';
        display: inline-block;
        width: 3px;
        height: 1em;
        margin-left: 5px;
        vertical-align: -.12em;
        background: var(--crimson);
        animation: blink .9s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .home-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }
      .home-actions a {
        min-width: 150px;
        padding: 14px 18px;
        border: 1px solid var(--black);
        background: var(--black);
        color: #fff;
        font-weight: 900;
        text-decoration: none;
      }
      .home-actions a.secondary { background: transparent; color: var(--black); }
      @media (max-width: 680px) {
        .home-actions { flex-direction: column; align-items: stretch; }
        .typing-line { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="./" aria-label="JalanLens home" aria-current="page">
        <img src="assets/jalanlens-logo.svg" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="about/">About Us</a>
        <a href="login/">Log In</a>
      </nav>
    </header>
    <video class="hero-bg-video" autoplay muted loop playsinline preload="auto" poster="assets/jalanlens-scenery-poster.jpg" aria-hidden="true">
      <source src="assets/jalanlens-scenery-loop.webm" type="video/webm" />
      <source src="assets/jalanlens-scenery-loop.mp4" type="video/mp4" />
    </video>
    <main>
      <h1 class="homepage-title">JalanLens</h1>
      <div class="typing-line" aria-live="polite"><span id="typedText"></span></div>
      <div class="home-actions">
        <a href="login/">Log In</a>
        <a class="secondary" href="about/">About Us</a>
      </div>
    </main>
    <script>
      const sentences = [
        "See every street through an accessibility lens.",
        "Turn footpath evidence into civic action.",
        "Map safer journeys for every mobility need.",
        "Combine street view, satellite context, and public feedback.",
        "Help cities prioritize the routes that matter most."
      ];
      const target = document.getElementById("typedText");
      let sentenceIndex = 0, charIndex = 0, deleting = false;
      function tick() {
        const sentence = sentences[sentenceIndex];
        target.textContent = sentence.slice(0, charIndex);
        if (!deleting && charIndex < sentence.length) {
          charIndex += 1;
          return setTimeout(tick, 42);
        }
        if (!deleting && charIndex === sentence.length) {
          deleting = true;
          return setTimeout(tick, 1500);
        }
        if (deleting && charIndex > 0) {
          charIndex -= 1;
          return setTimeout(tick, 22);
        }
        deleting = false;
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(tick, 320);
      }
      tick();
    </script>
  </body>
</html>
