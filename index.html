<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/jalanlens-icon-192.png" />
    <title>JalanLens</title>
    <link rel="stylesheet" href="harvard.css?v=20260731i" />
    <style>
      :root {
        --black: #1e1e1e;
        --crimson: #a51c30;
        --paper: #f3f3f1;
        --serif: 'Libre Baskerville', Baskerville, Georgia, serif;
        --sans: 'Source Sans 3', Arial, Helvetica, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--black);
        font-family: var(--sans);
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(243,243,241,.08), rgba(243,243,241,.34) 58%, rgba(243,243,241,.52)),
          radial-gradient(circle at 70% 24%, rgba(165,28,48,.18), transparent 28%);
      }
      .hero-bg-video {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: saturate(.86) contrast(.98) brightness(1.06);
      }
      main {
        position: relative;
        z-index: 2;
        width: min(1120px, calc(100% - 40px));
        padding-top: 76px;
        text-align: center;
      }
      .homepage-title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(72px, 15vw, 176px);
        font-weight: 400;
        line-height: .86;
        letter-spacing: -.07em;
        color: #111827;
        text-shadow: 0 2px 0 rgba(255,255,255,.72), 0 18px 42px rgba(15,23,42,.22);
      }
      .typing-line {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 70px;
        width: min(900px, calc(100vw - 48px));
        margin-top: 30px;
        padding: 18px 38px;
        border: 0;
        border-radius: 999px;
        background:
          linear-gradient(90deg, transparent 0 5%, rgba(255,255,255,.88) 5% 7%, transparent 7% 13%, rgba(255,255,255,.88) 13% 15%, transparent 15% 21%, rgba(255,255,255,.88) 21% 23%, transparent 23% 29%, rgba(255,255,255,.88) 29% 31%, transparent 31% 37%, rgba(255,255,255,.88) 37% 39%, transparent 39% 45%, rgba(255,255,255,.88) 45% 47%, transparent 47% 53%, rgba(255,255,255,.88) 53% 55%, transparent 55% 61%, rgba(255,255,255,.88) 61% 63%, transparent 63% 69%, rgba(255,255,255,.88) 69% 71%, transparent 71% 77%, rgba(255,255,255,.88) 77% 79%, transparent 79% 85%, rgba(255,255,255,.88) 85% 87%, transparent 87% 100%) center/100% 4px no-repeat,
          linear-gradient(180deg, #111827 0%, #1f2937 47%, #0f172a 53%, #020617 100%);
        color: #fff7d6;
        font-family: var(--serif);
        font-size: clamp(19px, 2.65vw, 31px);
        font-weight: 700;
        letter-spacing: -.035em;
        box-shadow:
          inset 0 12px 0 rgba(255,255,255,.06),
          inset 0 1px 0 rgba(255,255,255,.22),
          inset 0 -7px 0 rgba(0,0,0,.22),
          0 20px 55px rgba(15,23,42,.32);
        overflow: hidden;
      }
      .typing-line::before,
      .typing-line::after {
        content: "";
        position: absolute;
        left: 26px;
        right: 26px;
        height: 3px;
        background: #fbbf24;
        border-radius: 999px;
        opacity: .95;
        box-shadow: 0 0 14px rgba(251,191,36,.35);
      }
      .typing-line::before { top: 10px; }
      .typing-line::after { bottom: 10px; }
      .typing-line #typedText {
        position: relative;
        z-index: 1;
        min-width: min(720px, calc(100vw - 140px));
        font-family: var(--serif);
        padding: 2px 18px 4px;
        border-radius: 999px;
        background: rgba(15,23,42,.78);
        color: #fff7d6 !important;
        text-shadow: 0 2px 10px rgba(0,0,0,.75);
      }
      #typedText::after {
        content: '';
        display: inline-block;
        width: 3px;
        height: 1em;
        margin-left: 5px;
        vertical-align: -.12em;
        background: #fbbf24;
        box-shadow: 0 0 10px rgba(251,191,36,.7);
        animation: blink .9s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .home-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }
      .home-actions a {
        min-width: 150px;
        padding: 14px 18px;
        border: 1px solid var(--black);
        background: var(--black);
        color: #fff;
        font-weight: 900;
        text-decoration: none;
      }
      .home-actions a.secondary { background: transparent; color: var(--black); }
      @media (max-width: 680px) {
        .home-actions { flex-direction: column; align-items: stretch; }
        .typing-line { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="./" aria-label="JalanLens home" aria-current="page">
        <img src="assets/jalanlens-logo.png" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="about/">About Us</a>
        <a href="login/">Log In</a>
      </nav>
    </header>
    <video class="hero-bg-video" autoplay muted loop playsinline preload="auto" poster="assets/jalanlens-home-city-poster.jpg?v=20260731sg" aria-hidden="true">
      <source src="assets/jalanlens-home-city-loop.webm?v=20260731sg" type="video/webm" />
      <source src="assets/jalanlens-home-city-loop.mp4?v=20260731sg" type="video/mp4" />
    </video>
    <main>
      <h1 class="homepage-title">JalanLens</h1>
      <div class="typing-line" aria-live="polite"><span id="typedText"></span></div>
      <div class="home-actions">
        <a href="login/">Log In</a>
        <a class="secondary" href="about/">About Us</a>
      </div>
    </main>
    <script>
      const sentences = [
        "See every street through an accessibility lens.",
        "Turn footpath evidence into civic action.",
        "Map safer journeys for every mobility need.",
        "Combine street view, satellite context, and public feedback.",
        "Help cities prioritize the routes that matter most."
      ];
      const target = document.getElementById("typedText");
      let sentenceIndex = 0, charIndex = 0, deleting = false;
      function tick() {
        const sentence = sentences[sentenceIndex];
        target.textContent = sentence.slice(0, charIndex);
        if (!deleting && charIndex < sentence.length) {
          charIndex += 1;
          return setTimeout(tick, 42);
        }
        if (!deleting && charIndex === sentence.length) {
          deleting = true;
          return setTimeout(tick, 1500);
        }
        if (deleting && charIndex > 0) {
          charIndex -= 1;
          return setTimeout(tick, 22);
        }
        deleting = false;
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(tick, 320);
      }
      tick();
    </script>
  </body>
</html>
