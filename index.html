<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Volumetric Infrastructure Dashboard</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #ffffff;
      }
      #legend {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(237, 240, 70, 0.864);
        color: #000000;
        padding: 15px;
        font-family: monospace;
        border-radius: 6px;
        border: 1px solid #ddd57e;
        pointer-events: none;
      }
      .color-box {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border-radius: 2px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <div id="legend">
      <h3>Singapore Infrastructure Layers</h3>
      <div>
        <span class="color-box" style="background: #222222"></span>Primary
        Highways
      </div>
      <div>
        <span class="color-box" style="background: #333333"></span>Residential
        Streets
      </div>
      <div>
        <span class="color-box" style="background: #444444"></span>HDB Service
        Ways
      </div>
      <div>
        <span class="color-box" style="background: #33ff33"></span>LTA Footpaths
      </div>
      <div>
        <span class="color-box" style="background: #00ffff"></span>Mobility
        Cycleways
      </div>
    </div>

    <script>
      // --- 1. SCENE SEEDING & VIEWPORT SETUP ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        5000,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true; // Enable shadows for physical realism
      document.body.appendChild(renderer.domElement);

      // Add interactive mouse tracking, panning, and zooming controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from passing below ground plane

      // --- 2. TROPICAL LIGHTING CONFIGURATION ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
      sunLight.position.set(200, 400, 150);
      sunLight.castShadow = true;
      scene.add(sunLight);

      camera.position.set(0, 150, 250);
      controls.target.set(0, 0, 0);

      // --- UPDATED FETCH LAYER WITH AUTO-CENTERING ---
      fetch("threejs_3d_roads.json")
        .then((response) => response.json())
        .then((payload) => {
          // 1. Render all the physical 3D roads
          generateVolumetricRoads(payload.mesh_roads);

          // 2. Compute the bounding box of the entire generated scene
          const boundingBox = new THREE.Box3().setFromObject(scene);
          const center = new THREE.Vector3();
          boundingBox.getCenter(center);
          const size = new THREE.Vector3();
          boundingBox.getSize(size);

          // 3. Force camera controls to lock onto the exact center of your coordinates
          controls.target.copy(center);

          // 4. Position the camera safely above and back from the map size dynamically
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(center.x, maxDim * 1.2, center.z + maxDim * 1.2);

          // 5. Update projection matrix and refresh controls
          camera.lookAt(center);
          camera.updateProjectionMatrix();
          controls.update();

          print(
            `🗺️ Scene centered at: X:${center.x.toFixed(2)}, Z:${center.z.toFixed(2)}. Camera moved safely to capture map.`,
          );
        })
        .catch((err) => console.error("❌ Data loading failed: ", err));

      // --- 4. VOLUMETRIC ROAD GENERATION ENGINE ---
      function generateVolumetricRoads(meshRoads) {
        meshRoads.forEach((road) => {
          if (road.coordinates.length < 2) return;

          // Convert coordinates into a mathematical Three.js spatial track curve
          const curvePoints = road.coordinates.map(
            (pt) => new THREE.Vector3(pt[0], pt[1], pt[2]),
          );
          const roadPathCurve = new THREE.CatmullRomCurve3(curvePoints);

          // Define a 2D rectangular profile shape for extrusion based on the road's true width
          const halfWidth = road.width / 2;
          const thickness = road.thickness;

          const roadProfileShape = new THREE.Shape();
          roadProfileShape.moveTo(-halfWidth, 0);
          roadProfileShape.lineTo(halfWidth, 0);
          roadProfileShape.lineTo(halfWidth, thickness);
          roadProfileShape.lineTo(-halfWidth, thickness);
          roadProfileShape.lineTo(-halfWidth, 0);

          // Configure the extrusion parameters matching the linear track curve
          const extrusionSettings = {
            steps: road.coordinates.length * 3, // Dense segments for smooth curves
            bevelEnabled: false,
            extrudePath: roadPathCurve,
          };

          // Extrude the 2D cross-section into a physical solid 3D ribbon geometry
          const geometry = new THREE.ExtrudeGeometry(
            roadProfileShape,
            extrusionSettings,
          );

          // Setup materials. If it's a bridge, give it structural shadows. If a tunnel, make it semi-transparent[cite: 81, 85].
          const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(road.color_hex),
            roughness: 0.8,
            metalness: 0.1,
            transparent: road.is_tunnel,
            opacity: road.is_tunnel ? 0.3 : 1.0,
          });

          const roadMesh = new THREE.Mesh(geometry, material);
          roadMesh.castShadow = true;
          roadMesh.receiveShadow = true;

          // Optional: Attach metadata attributes straight onto the mesh for later interactive features
          roadMesh.userData = {
            id: road.id,
            name: road.name,
            fclass: road.fclass,
            direction: road.direction_mode,
          };

          scene.add(roadMesh);
        });
      }

      // --- 5. VISUALIZATION ANIMATION ENGINE LOOP ---
      function renderLoop() {
        requestAnimationFrame(renderLoop);
        controls.update(); // Smooth camera movements
        renderer.render(scene, camera);
      }
      renderLoop();

      // Handle responsive window scaling dynamically
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
