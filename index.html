<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AccessTwin Role Select</title>
    <style>
      :root {
        --bg: #020617;
        --card: rgba(15, 23, 42, 0.82);
        --line: rgba(125, 211, 252, 0.28);
        --txt: #e0f2fe;
        --muted: #94a3b8;
        --blue: #38bdf8;
        --green: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.20), transparent 30%),
          radial-gradient(circle at 80% 90%, rgba(34, 197, 94, 0.16), transparent 34%),
          var(--bg);
        color: var(--txt);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(980px, 100%);
      }
      .eyebrow {
        color: var(--blue);
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        margin: 10px 0 10px;
        font-size: clamp(34px, 6vw, 68px);
        line-height: 0.95;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
        max-width: 760px;
      }
      .roles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 28px;
      }
      .role {
        min-height: 250px;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 24px;
        background: var(--card);
        color: inherit;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }
      .role:hover {
        transform: translateY(-4px);
        border-color: rgba(186, 230, 253, 0.78);
        background: rgba(15, 23, 42, 0.95);
      }
      .role b {
        display: block;
        font-size: 24px;
        margin-bottom: 8px;
      }
      .role small {
        color: var(--muted);
        line-height: 1.45;
      }
      ul {
        padding-left: 18px;
        margin: 16px 0 0;
        color: #cbd5e1;
        line-height: 1.55;
      }
      .tag {
        display: inline-block;
        margin-top: 18px;
        border: 1px solid rgba(125, 211, 252, 0.35);
        border-radius: 999px;
        padding: 7px 10px;
        color: #bae6fd;
        font-weight: 800;
        font-size: 12px;
      }
      @media (max-width: 760px) {
        .roles { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AccessTwin / EquiRoute</div>
      <h1>choose your platform</h1>
      <p>
        Select a role before entering the Clementi accessibility twin. Public users get a clean feedback/reporting experience; authority users get planning tools, persona-agent simulation, and improvement priorities.
      </p>
      <div class="roles">
        <button class="role" data-role="public">
          <b>Public user</b>
          <small>For residents, commuters, and event participants reporting street-level accessibility issues.</small>
          <ul>
            <li>browse Earth + street view</li>
            <li>submit feedback on a footpath or feature</li>
            <li>upload clear evidence photos when needed</li>
          </ul>
          <span class="tag">enter public platform</span>
        </button>
        <button class="role" data-role="authority">
          <b>Authority / planner</b>
          <small>For agencies, town councils, operators, and internal reviewers deciding what to fix first.</small>
          <ul>
            <li>run disability persona agents across street parts</li>
            <li>see passability, blockers, and recommended improvements</li>
            <li>review standards/data-source notes and operational layers</li>
          </ul>
          <span class="tag">enter authority dashboard</span>
        </button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "earth_accessibility.html";
      document.querySelectorAll("[data-role]").forEach((button) => {
        button.addEventListener("click", () => {
          const role = button.dataset.role;
          localStorage.setItem("accesstwin_role", role);
          const target = new URL(next, location.href);
          target.searchParams.set("role", role);
          location.href = target.pathname.split("/").pop() + target.search;
        });
      });
    </script>
  </body>
</html>
