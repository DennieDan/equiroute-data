<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EquiRoute 3D - 5-Hour MVP</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #111;
        color: white;
        font-family: sans-serif;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <div id="info">
      <h2>EquiRoute 3D: Local MVP</h2>
      <p>
        Green: Accessible |
        <span style="color: #ff3333; font-weight: bold"
          >Red: Faked Step-Drop Bottleneck</span
        >
        |
        <span style="color: #ffff00; font-weight: bold">Yellow: Start / End</span>
        |
        <span style="color: #33aaff; font-weight: bold">Blue: Kerb Ramp</span> 
        |
        <span style="color: #ff8800; font-weight: bold">Orange: Barrier/Stair</span>
      </p>
      <p id="status" style="color: #ffaa00"></p>
    </div>

    <script>
      // 1. Setup Scene, Camera, and Renderer
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100000,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const statusEl = document.getElementById("status");

      const FALLBACK_START = [103.77270416701658, 1.30098333297992];
      const FALLBACK_END = [103.77165274445558, 1.30783047048090];

      function addStarMarker(lon, lat, offsetX, offsetZ, size, box) {
        const outer = size;
        const inner = size * 0.4;
        const points = 5;
        const shape = new THREE.Shape();
        for (let i = 0; i < points * 2; i++) {
          const r = i % 2 === 0 ? outer : inner;
          const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        shape.closePath();

        const geometry = new THREE.ShapeGeometry(shape);
        const material = new THREE.MeshBasicMaterial({
          color: 0xffff00,
          side: THREE.DoubleSide,
        });
        const star = new THREE.Mesh(geometry, material);
        star.rotation.x = -Math.PI / 2;
        star.position.set(lon - offsetX, size * 0.15, lat - offsetZ);
        scene.add(star);
        box.expandByObject(star);
      }

      function fitCameraToBox(box) {
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z, 0.001);
        const fov = camera.fov * (Math.PI / 180);
        const dist = maxDim / (2 * Math.tan(fov / 2));
        camera.position.set(
          center.x,
          center.y + dist * 0.8,
          center.z + dist * 1.2,
        );
        camera.lookAt(center);
        camera.near = dist / 100;
        camera.far = dist * 100;
        camera.updateProjectionMatrix();
      }

      function addKerbMarker(lon, lat, offsetX, offsetZ, size, kerbType, box) {
        const colorMap = {
          ramp: 0x33aaff,     // blue = confirmed accessible kerb ramp
          barrier: 0xff8800,  // orange = stair/barrier, not accessible
          unknown: 0xaaaaaa,  // grey = unclassified, needs manual check
        };
        const color = colorMap[kerbType] || colorMap.unknown;

        const geometry = new THREE.CircleGeometry(size, 12);
        const material = new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide,
        });
        const disc = new THREE.Mesh(geometry, material);
        disc.rotation.x = -Math.PI / 2;
        disc.position.set(lon - offsetX, size * 0.1, lat - offsetZ);
        scene.add(disc);
        box.expandByObject(disc);
      }

      // 2. Fetch and Render the Graph Payload
      fetch("sim_output.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          const edges = Array.isArray(data) ? data : data.edges;
          const startCoord = Array.isArray(data) ? FALLBACK_START : data.start;
          const endCoord = Array.isArray(data) ? FALLBACK_END : data.end;

          if (!edges || !edges.length) {
            throw new Error("sim_output.json is empty");
          }

          const box = new THREE.Box3();
          const firstCoord = edges[0].coords[0];
          const offsetX = firstCoord[0];
          const offsetZ = firstCoord[1];

          edges.forEach((edge) => {
            const points = [];
            points.push(
              new THREE.Vector3(
                edge.coords[0][0] - offsetX,
                0,
                edge.coords[0][1] - offsetZ,
              ),
            );
            points.push(
              new THREE.Vector3(
                edge.coords[1][0] - offsetX,
                0,
                edge.coords[1][1] - offsetZ,
              ),
            );

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const color = edge.isHighCost ? 0xff3333 : 0x33ff33;
            const material = new THREE.LineBasicMaterial({ color });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            box.expandByObject(line);
          });

          const sceneSize = box.getSize(new THREE.Vector3());
          const starSize =
            Math.max(sceneSize.x, sceneSize.z, 0.0001) * 0.035;

          
          addStarMarker(
            startCoord[0],
            startCoord[1],
            offsetX,
            offsetZ,
            starSize,
            box,
          );
          addStarMarker(
            endCoord[0],
            endCoord[1],
            offsetX,
            offsetZ,
            starSize,
            box,
          );

          const kerbs = data.kerbs || [];
          const kerbSize = starSize * 0.5; // slightly smaller than start/end stars
          kerbs.forEach((k) => {
            addKerbMarker(
              k.coord[0],
              k.coord[1],
              offsetX,
              offsetZ,
              kerbSize,
              k.kerbType,
              box
            );
          });
          fitCameraToBox(box);
          statusEl.textContent = `Loaded ${edges.length} edges, ${kerbs.length} kerb points`;
        })
        .catch((err) => {
          statusEl.textContent = `Failed to load data: ${err.message}. Run: python3 -m http.server 8000`;
        });

      // 3. Simple Animation Loop
      function animate() {
        requestAnimationFrame(animate);
        // Slowly rotate scene for showcase effect
        scene.rotation.y += 0.002;
        renderer.render(scene, camera);
      }
      animate();

      // Handle window resizing seamlessly
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
