<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/jalanlens-icon-192.png" />
    <title>JalanLens</title>
    <link rel="stylesheet" href="harvard.css?v=20260731m" />
    <style>
      :root {
        --black: #1e1e1e;
        --crimson: #a51c30;
        --paper: #f3f3f1;
        --serif: 'Libre Baskerville', Baskerville, Georgia, serif;
        --sans: 'Source Sans 3', Arial, Helvetica, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--black);
        font-family: var(--sans);
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(30,30,30,.5) 0%, rgba(30,30,30,.22) 42%, rgba(30,30,30,.58) 100%),
          radial-gradient(circle at 50% 40%, rgba(165,28,48,.24), transparent 36%),
          linear-gradient(90deg, rgba(43,6,27,.46), transparent 28%, transparent 72%, rgba(43,6,27,.38));
      }
      .hero-bg-video {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: saturate(.9) contrast(1.04) brightness(.94);
      }
      main {
        position: relative;
        z-index: 2;
        width: min(1120px, calc(100% - 40px));
        padding-top: 76px;
        text-align: center;
      }
      .homepage-title {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(72px, 15vw, 176px);
        font-weight: 400;
        line-height: .86;
        letter-spacing: -.07em;
        color: #fff !important;
        -webkit-text-stroke: 0 transparent;
        text-shadow:
          0 0 18px rgba(0,0,0,.82),
          0 14px 44px rgba(0,0,0,.76);
      }
      .typing-line {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 70px;
        width: min(900px, calc(100vw - 48px));
        margin-top: 30px;
        padding: 18px 38px 22px;
        border: 0;
        border-bottom: 6px solid var(--crimson);
        border-radius: 0;
        background: rgba(30,30,30,.94);
        color: #fff;
        font-family: var(--serif);
        font-size: clamp(19px, 2.65vw, 31px);
        font-weight: 700;
        letter-spacing: -.035em;
        box-shadow: 0 18px 44px rgba(0,0,0,.44);
        overflow: hidden;
      }
      .typing-line::before,
      .typing-line::after {
        content: none;
      }
      .typing-line #typedText {
        position: relative;
        z-index: 1;
        min-width: min(720px, calc(100vw - 140px));
        font-family: var(--serif);
        padding: 0 18px;
        border-radius: 0;
        background: transparent;
        color: #fff !important;
        text-shadow: 0 2px 16px rgba(0,0,0,.8);
      }
      #typedText::after {
        content: '';
        display: inline-block;
        width: 3px;
        height: 1em;
        margin-left: 5px;
        vertical-align: -.12em;
        background: var(--crimson);
        box-shadow: 0 0 10px rgba(165,28,48,.72);
        animation: blink .9s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .home-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }
      .home-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-width: 166px;
        padding: 14px 18px 15px;
        border: 1px solid rgba(255,255,255,.18);
        border-bottom: 4px solid var(--crimson);
        background: var(--black);
        color: #fff;
        font-family: var(--sans);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 16px 34px rgba(0,0,0,.34);
      }
      .home-actions a::after { content: '→'; font-weight: 900; color: var(--crimson); }
      .home-actions a.secondary { background: var(--black); color: #fff; }
      .home-actions a:hover,
      .home-actions a:focus-visible {
        background: #fff;
        color: var(--black);
        border-color: #fff;
        border-bottom-color: var(--crimson);
      }
      @media (max-width: 680px) {
        .home-actions { flex-direction: column; align-items: stretch; }
        .typing-line { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="./" aria-label="JalanLens home" aria-current="page">
        <img src="assets/jalanlens-logo.png" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="about/">About Us</a>
        <a href="login/">Log In</a>
      </nav>
    </header>
    <video class="hero-bg-video" autoplay muted loop playsinline preload="auto" poster="assets/jalanlens-home-city-poster.jpg?v=20260731sg" aria-hidden="true">
      <source src="assets/jalanlens-home-city-loop.webm?v=20260731sg" type="video/webm" />
      <source src="assets/jalanlens-home-city-loop.mp4?v=20260731sg" type="video/mp4" />
    </video>
    <main>
      <h1 class="homepage-title">JalanLens</h1>
      <div class="typing-line" aria-live="polite"><span id="typedText"></span></div>
      <div class="home-actions">
        <a href="login/">Log In</a>
        <a class="secondary" href="about/">About Us</a>
      </div>
    </main>
    <script>
      const sentences = [
        "See every street through an accessibility lens.",
        "Turn footpath evidence into civic action.",
        "Map safer journeys for every mobility need.",
        "Combine street view, satellite context, and public feedback.",
        "Help cities prioritize the routes that matter most."
      ];
      const target = document.getElementById("typedText");
      let sentenceIndex = 0, charIndex = 0, deleting = false;
      function tick() {
        const sentence = sentences[sentenceIndex];
        target.textContent = sentence.slice(0, charIndex);
        if (!deleting && charIndex < sentence.length) {
          charIndex += 1;
          return setTimeout(tick, 42);
        }
        if (!deleting && charIndex === sentence.length) {
          deleting = true;
          return setTimeout(tick, 1500);
        }
        if (deleting && charIndex > 0) {
          charIndex -= 1;
          return setTimeout(tick, 22);
        }
        deleting = false;
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(tick, 320);
      }
      tick();
    </script>
  </body>
</html>
