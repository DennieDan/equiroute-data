<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquiRoute Earth Accessibility</title>
    <link rel="stylesheet" href="https://unpkg.com/maptalks/dist/maptalks.css" />
    <link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet" />
    <style>
      :root{--bg:rgba(2,6,23,.86);--line:rgba(125,211,252,.34);--txt:#eef9ff;--muted:#a7c7d8;--green:#22f36e;--amber:#ffd166;--red:#ff3b52;--blue:#38bdf8;--orange:#fb923c}
      html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06101d;color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #map,#mapillaryView{position:absolute;inset:0;width:100%;height:100%;background:#07111f}
      #map{z-index:1} #mapillaryView{z-index:5;display:none}.street-mode #mapillaryView{display:block}.street-mode #map{opacity:0;pointer-events:none}
      #mapillaryView .mapillary-interactive,#mapillaryView .mapillary-dom,#mapillaryView canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
      #streetPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:saturate(1.08) contrast(1.04)}
      .hud{position:absolute;z-index:20;border:1px solid var(--line);background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.38);backdrop-filter:blur(14px);border-radius:18px;color:var(--txt)}
      #topbar{top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;padding:10px 12px;z-index:30}.brand{font-weight:900;letter-spacing:.01em}.pill{border:1px solid rgba(148,163,184,.26);background:rgba(15,23,42,.78);border-radius:999px;padding:7px 10px;font-size:12px}.spacer{flex:1}
      button,select,input{border:1px solid rgba(125,211,252,.35);background:rgba(15,23,42,.88);color:var(--txt);border-radius:12px;padding:8px 10px;font-weight:750}button{cursor:pointer}button:hover,button.active{background:linear-gradient(135deg,#075985,#0e7490);border-color:#bae6fd}select{max-width:360px}
      #miniMap{position:absolute;right:14px;bottom:14px;width:240px;height:150px;border-radius:18px;overflow:hidden;z-index:22;border:1px solid rgba(125,211,252,.38);box-shadow:0 20px 60px rgba(0,0,0,.45);display:none}.street-mode #miniMap{display:block}#miniMap .label{position:absolute;left:8px;top:8px;background:rgba(2,6,23,.78);border-radius:999px;padding:4px 8px;font-size:11px;color:#bae6fd;z-index:2}
      #detailCard{left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));padding:12px 14px;z-index:26;display:none}#detailCard.visible{display:block}.street-mode #detailCard{bottom:18px}.detail-head{display:flex;gap:10px;align-items:center}.score{font-size:28px;font-weight:950}.title{font-weight:900}.sub{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:8px}.metric b{display:block}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.close{margin-left:auto;border-radius:999px;width:30px;height:30px;padding:0}
      #segmentButtons{position:absolute;inset:0;z-index:25;pointer-events:none}.seg-btn{position:absolute;pointer-events:auto;width:24px;height:24px;border-radius:999px;border:2px solid white;background:var(--blue);box-shadow:0 0 0 5px rgba(56,189,248,.24),0 8px 22px rgba(0,0,0,.45);color:#00111d;font-size:10px;font-weight:950;padding:0}.seg-btn.bad{background:var(--red)}.seg-btn.warn{background:var(--amber)}.seg-btn.addon::after{content:attr(data-addon);position:absolute;left:18px;top:-16px;background:rgba(2,6,23,.82);color:white;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 6px;font-size:9px;white-space:nowrap}
      #settings{right:14px;top:70px;width:min(390px,calc(100vw - 28px));padding:14px;z-index:35;display:none}#settings.visible{display:block}#settings textarea{width:100%;height:70px;border-radius:12px;background:#020617;color:#e0f2fe;border:1px solid rgba(125,211,252,.28)}#settings p{font-size:12px;color:var(--muted);line-height:1.35}.settings-grid{display:grid;grid-template-columns:1fr auto;gap:8px}.status{position:absolute;left:14px;bottom:14px;z-index:21;background:rgba(2,6,23,.82);border:1px solid rgba(125,211,252,.28);border-radius:999px;padding:8px 12px;font-size:12px;color:#dff7ff}.street-mode .status{display:none}
      @media(max-width:800px){#topbar{flex-wrap:wrap}select{max-width:100%;width:100%}.metrics{grid-template-columns:repeat(2,1fr)}#miniMap{display:none!important}}
    </style>
    <script src="https://unpkg.com/maptalks/dist/maptalks.min.js"></script>
    <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="mapillaryView"></div>
    <div id="segmentButtons"></div>
    <div id="topbar" class="hud">
      <div class="brand">EquiRoute Earth</div>
      <span class="pill" id="modeLabel">3D world view</span>
      <select id="segmentSelect" title="Choose a 5 m segment"></select>
      <button id="earthBtn" class="active">Earth</button>
      <button id="streetBtn">Street View</button>
      <button id="prevBtn">←</button><button id="nextBtn">→</button>
      <div class="spacer"></div>
      <span class="pill"><b id="segCount">–</b> segments</span>
      <span class="pill"><b id="buildingCount">–</b> buildings</span>
      <button id="settingsBtn">⚙</button>
    </div>
    <div id="settings" class="hud">
      <button class="close" id="closeSettings">×</button>
      <h3>Settings</h3>
      <p>Mapillary token, data-source notes, and standards references live here so the main demo stays clean.</p>
      <div class="settings-grid"><input id="mapillaryTokenInput" type="password" placeholder="Mapillary client token"/><button id="saveMapillaryTokenBtn">Save</button></div>
      <p id="tokenStatus"></p>
      <h4>References hidden from demo</h4>
      <p id="standardsText"></p>
    </div>
    <div id="miniMap"><div class="label">Earth context</div></div>
    <section id="detailCard" class="hud">
      <div class="detail-head"><div><div class="title" id="selectedName">Select a segment</div><div class="sub" id="selectedDesc"></div></div><div class="spacer"></div><div class="score" id="activeScore">–</div><button class="close" id="closeDetail">×</button></div>
      <div class="metrics" id="metricList"></div>
    </section>
    <div class="status" id="status">Loading Clementi digital twin…</div>
    <script>
      const COLORS={green:'#22f36e',amber:'#ffd166',red:'#ff3b52',blue:'#38bdf8',orange:'#fb923c'};
      const state={world:null,buildings:null,segments:[],features:[],selectedIndex:0,mode:'earth',mapillaryViewer:null,miniMap:null,layers:{},token:null};
      window.__EARTH_ACCESSIBILITY_STATE=state;
      const SATELLITE_TILE='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      const map=new maptalks.Map('map',{center:[103.7716,1.3062],zoom:17,pitch:62,bearing:-24,baseLayer:new maptalks.TileLayer('satellite-daylight',{urlTemplate:SATELLITE_TILE,renderer:'canvas',attribution:'Tiles © Esri, Maxar, Earthstar Geographics'})});
      const routeLayer=new maptalks.VectorLayer('5m-accessibility-segments').addTo(map), poiLayer=new maptalks.VectorLayer('features').addTo(map), buildingLayer=new maptalks.VectorLayer('buildings').addTo(map), selectedLayer=new maptalks.VectorLayer('selected').addTo(map);state.layers={routeLayer,poiLayer,buildingLayer,selectedLayer};
      function getToken(){return localStorage.getItem('equiroute_mapillary_token')||''}function setToken(t){if((t||'').trim())localStorage.setItem('equiroute_mapillary_token',t.trim());updateSettings()}function setStatus(t){document.getElementById('status').textContent=t}function scoreColor(s){return s>=67?COLORS.green:s>=45?COLORS.amber:COLORS.red}function middle(f){const c=f.geometry.coordinates;return[(c[0][0]+c[c.length-1][0])/2,(c[0][1]+c[c.length-1][1])/2]}function bearing(a,b){const y=Math.sin((b[0]-a[0])*Math.PI/180)*Math.cos(b[1]*Math.PI/180);const x=Math.cos(a[1]*Math.PI/180)*Math.sin(b[1]*Math.PI/180)-Math.sin(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.cos((b[0]-a[0])*Math.PI/180);return Math.atan2(y,x)*180/Math.PI}function centroid(r){let x=0,y=0,n=r.length||1;r.forEach(c=>{x+=c[0];y+=c[1]});return[x/n,y/n]}
      function addonFor(p){const m=p.metrics||{};if(m.near_bus_stop_m!=null&&m.near_bus_stop_m<18)return'bus stop';if(m.kerb_ramp_present)return'ramp';if(m.covered)return'shelter';if(m.tactile_guidance)return'tactile';return''}
      function renderBuildings(g){const geoms=g.features.map(f=>f.geometry?.type==='Polygon'?new maptalks.Polygon(f.geometry.coordinates,{symbol:{polygonFill:'#ffffff',polygonOpacity:.08,lineColor:'rgba(255,255,255,.22)',lineWidth:.35}}):null).filter(Boolean);buildingLayer.addGeometry(geoms);document.getElementById('buildingCount').textContent=geoms.length.toLocaleString()}
      function renderWorld(world){state.segments=world.features.filter(f=>f.properties.kind==='route_segment'&&f.properties.feature_type!=='kerb_line');state.features=world.features.filter(f=>f.properties.kind!=='route_segment');const allRoutes=world.features.filter(f=>f.properties.kind==='route_segment');const routeGeoms=allRoutes.map((f,i)=>{const selectable=f.properties.feature_type!=='kerb_line';const selectableIndex=selectable?state.segments.indexOf(f):-1;return new maptalks.LineString(f.geometry.coordinates,{properties:{...f.properties,index:selectableIndex},symbol:{lineColor:selectable?scoreColor(f.properties.overall_accessibility_score):'#94a3b8',lineWidth:f.properties.feature_type==='kerb_line'?1.4:4,lineOpacity:f.properties.feature_type==='kerb_line'?.28:.88}}).on('click',()=>{if(selectable){state.mode='street';selectSegment(selectableIndex,true)}})});routeLayer.addGeometry(routeGeoms);const poi=state.features.map(f=>{const p=f.properties;const coord=f.geometry.type==='Point'?f.geometry.coordinates:centroid(f.geometry.coordinates[0]);const label=p.kind==='bus_stop'?'BUS':p.kind==='mrt_station'?'MRT':p.kind==='covered_linkway'?'shelter':p.kind==='pedestrian_overhead_bridge'?'bridge':p.kind==='bollard'?'bollard':'';return new maptalks.Marker(coord,{symbol:[{markerType:'ellipse',markerFill:p.kind==='bollard'?COLORS.red:COLORS.orange,markerLineColor:'#fff',markerLineWidth:1,markerWidth:p.kind==='mrt_station'?22:14,markerHeight:p.kind==='mrt_station'?22:14},{textName:label,textSize:10,textFill:'#fff',textHaloFill:'#020617',textHaloRadius:2,textDy:-18}]})});poiLayer.addGeometry(poi);document.getElementById('segCount').textContent=state.segments.length.toLocaleString();document.getElementById('standardsText').textContent=[world.standards?.name,...(world.standards?.basis||[])].join(' · ');populateSelect();selectSegment(0,false)}
      function populateSelect(){segmentSelect.innerHTML=state.segments.map((f,i)=>`<option value="${i}">${f.properties.name} · ${Math.round(f.properties.metrics.length_m)}m · ${f.properties.overall_accessibility_score}</option>`).join('')} 
      function showDetail(p){detailCard.classList.add('visible');selectedName.textContent=`${p.name} · ${p.feature_type.replaceAll('_',' ')}`;selectedDesc.textContent=`${Math.round(p.metrics.length_m*10)/10} m segment${addonFor(p)?' · '+addonFor(p):''}`;activeScore.textContent=p.overall_accessibility_score;const m=p.metrics,c=p.component_scores;metricList.innerHTML=[['Width',m.clear_width_m+' m',c.clear_width],['Slope',m.running_slope_pct+'%',c.running_slope],['Cross slope',m.cross_slope_pct+'%',c.cross_slope],['Roughness',m.roughness_mm+' mm',c.surface_roughness],['Level change',m.vertical_change_mm+' mm',c.vertical_change],['Obstructions',m.obstruction_count,c.obstructions],['Shelter',m.covered?'yes':'no',c.shelter],['Tactile',m.tactile_guidance?'yes':'unknown',c.tactile_guidance]].map(x=>`<div class="metric"><span>${x[0]}</span><b style="color:${scoreColor(x[2])}">${x[1]}</b><small>${x[2]}/100</small></div>`).join('')}
      function selectSegment(index,street=false){if(!state.segments.length)return;state.selectedIndex=(index+state.segments.length)%state.segments.length;const f=state.segments[state.selectedIndex],p=f.properties,coords=f.geometry.coordinates;segmentSelect.value=state.selectedIndex;selectedLayer.clear();selectedLayer.addGeometry(new maptalks.LineString(coords,{symbol:{lineColor:COLORS.blue,lineWidth:10,lineOpacity:.98}}));showDetail(p);const mid=middle(f),brg=bearing(coords[0],coords[coords.length-1]);if(street){enterStreet(f,mid,brg)}else{enterEarth();map.animateTo({center:mid,zoom:18,pitch:62,bearing:-24},{duration:500});renderSegmentButtons()}}
      async function findMapillaryImage(coord){const token=getToken();if(!token)throw new Error('no token');const url=`https://graph.mapillary.com/images?fields=id,is_pano,thumb_2048_url,thumb_1024_url,thumb_256_url&lat=${coord[1]}&lng=${coord[0]}&radius=50&limit=1&access_token=${encodeURIComponent(token)}`;const data=await fetch(url).then(r=>{if(!r.ok)throw new Error('Mapillary '+r.status);return r.json()});return data.data?.[0]}
      async function findStreetImageForSegment(f){const origin=middle(f);const nearby=nearbySegments(f,28).map(middle);const points=[origin,...nearby].filter((pt,i,a)=>a.findIndex(x=>Math.abs(x[0]-pt[0])<1e-7&&Math.abs(x[1]-pt[1])<1e-7)===i);for(const pt of points){const img=await findMapillaryImage(pt);if(img)return img}return null}
      async function enterStreet(f,coord,brg){state.mode='street';document.body.classList.add('street-mode');earthBtn.classList.remove('active');streetBtn.classList.add('active');modeLabel.textContent='street view';map.animateTo({center:coord,zoom:20,pitch:78,bearing:brg},{duration:350});setupMiniMap();try{const img=await findStreetImageForSegment(f);if(!img)throw new Error('no image');if(state.mapillaryViewer){try{state.mapillaryViewer.remove()}catch(e){}}const thumb=img.thumb_2048_url||img.thumb_1024_url||img.thumb_256_url;if(!thumb)throw new Error('no street photo thumbnail');mapillaryView.innerHTML=`<img id="streetPhoto" src="${thumb}" alt="Mapillary street-level image"/>`;state.mapillaryImageId=img.id;}catch(e){mapillaryView.innerHTML='<div style="height:100%;display:grid;place-items:center;background:#020617;color:white"><div>Mapillary unavailable nearby. Paste the token in ⚙ or choose another street.</div></div>'}renderSegmentButtons(true)}
      function enterEarth(){state.mode='earth';document.body.classList.remove('street-mode');earthBtn.classList.add('active');streetBtn.classList.remove('active');modeLabel.textContent='3D world view';if(state.mapillaryViewer){try{state.mapillaryViewer.remove()}catch(e){}state.mapillaryViewer=null}renderSegmentButtons(false)}
      function setupMiniMap(){if(state.miniMap)return;state.miniMap=new maptalks.Map('miniMap',{center:map.getCenter(),zoom:18,pitch:0,bearing:0,baseLayer:new maptalks.TileLayer('miniBase',{urlTemplate:SATELLITE_TILE,renderer:'canvas'})});new maptalks.VectorLayer('mini-segments',routeLayer.getGeometries().map(g=>g.copy())).addTo(state.miniMap)}
      function renderSegmentButtons(street=false){segmentButtons.innerHTML='';const selected=state.segments[state.selectedIndex];if(!selected)return;let candidates=street?nearbySegments(selected,18):state.segments.filter((_,i)=>i%12===0).slice(0,180);candidates.forEach(f=>{const idx=state.segments.indexOf(f),p=f.properties,pt=street?streetButtonPoint(idx,candidates.length):map.coordinateToContainerPoint(new maptalks.Coordinate(...middle(f)));const b=document.createElement('button');b.className='seg-btn '+(p.overall_accessibility_score<45?'bad':p.overall_accessibility_score<67?'warn':'');const add=addonFor(p);if(add){b.classList.add('addon');b.dataset.addon=add}b.style.left=(pt.x-12)+'px';b.style.top=(pt.y-12)+'px';b.textContent=idx===state.selectedIndex?'●':'';b.title=`${p.name} ${p.overall_accessibility_score}/100`;b.onclick=()=>selectSegment(idx,state.mode==='street');segmentButtons.appendChild(b)})}
      function nearbySegments(base,n){const c=middle(base);return state.segments.map(f=>({f,d:Math.hypot((middle(f)[0]-c[0])*111320,(middle(f)[1]-c[1])*111320)})).sort((a,b)=>a.d-b.d).slice(0,n).map(x=>x.f)}
      function streetButtonPoint(i,total){const col=i%6,row=Math.floor(i/6);return{x:window.innerWidth*.24+col*86,y:window.innerHeight*.42+row*62}}
      function updateSettings(){tokenStatus.textContent=getToken()?'Mapillary token saved in this browser.':'No Mapillary token saved; street view may be unavailable.'}
      segmentSelect.onchange=e=>selectSegment(Number(e.target.value),state.mode==='street');prevBtn.onclick=()=>selectSegment(state.selectedIndex-1,state.mode==='street');nextBtn.onclick=()=>selectSegment(state.selectedIndex+1,state.mode==='street');earthBtn.onclick=()=>selectSegment(state.selectedIndex,false);streetBtn.onclick=()=>selectSegment(state.selectedIndex,true);settingsBtn.onclick=()=>settings.classList.toggle('visible');closeSettings.onclick=()=>settings.classList.remove('visible');closeDetail.onclick=()=>detailCard.classList.remove('visible');saveMapillaryTokenBtn.onclick=()=>setToken(mapillaryTokenInput.value);map.on('moving zooming resize viewchange',()=>{if(state.mode==='earth')renderSegmentButtons(false)});window.addEventListener('resize',()=>renderSegmentButtons(state.mode==='street'));
      Promise.all([fetch('accessibility_world.geojson').then(r=>r.json()),fetch('buildings_clementi.geojson').then(r=>r.json())]).then(([world,buildings])=>{state.world=world;state.buildings=buildings;renderBuildings(buildings);renderWorld(world);const ext=routeLayer.getExtent();if(ext)map.fitExtent(ext,0,{animation:false});setStatus(`Loaded ${state.segments.length.toLocaleString()} 5 m segments, ${buildings.features.length.toLocaleString()} buildings`);updateSettings()}).catch(e=>setStatus('Failed to load: '+e.message));
    </script>
  </body>
</html>
