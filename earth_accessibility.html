<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquiRoute Earth Accessibility</title>
    <link rel="stylesheet" href="https://unpkg.com/maptalks/dist/maptalks.css" />
    <link href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" rel="stylesheet" />
    <style>
      :root{--bg:rgba(2,6,23,.86);--line:rgba(125,211,252,.34);--txt:#eef9ff;--muted:#a7c7d8;--green:#22f36e;--amber:#ffd166;--red:#ff3b52;--blue:#38bdf8;--orange:#fb923c}
      html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06101d;color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #satelliteFallback,#map,#mapillaryView,#threeOverlay{position:absolute;inset:0;width:100%;height:100%}#satelliteFallback{z-index:0;overflow:hidden;background:#06101d;filter:brightness(1.45) saturate(1.25) contrast(1.08)}#satelliteFallback img{position:absolute;width:256px;height:256px;object-fit:cover}#map{z-index:1;background:transparent}#mapillaryView,#threeOverlay{background:transparent}
      #map{z-index:1;filter:brightness(1.18) saturate(1.25) contrast(1.08)} #threeOverlay{z-index:10;pointer-events:none;background:transparent}.street-mode #threeOverlay{display:none} #mapillaryView{z-index:5;display:none}.street-mode #mapillaryView{display:block}.street-mode #map{opacity:1;pointer-events:auto;filter:brightness(1.18) saturate(1.25) contrast(1.08)}
      #mapillaryView .mapillary-interactive,#mapillaryView .mapillary-dom,#mapillaryView canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
      #streetPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:saturate(1.08) contrast(1.04)}.street-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:12px 16px;border-radius:16px;background:rgba(2,6,23,.75);border:1px solid rgba(125,211,252,.34);color:#e0f2fe}.seg-btn.feature{width:34px;height:34px;background:#38bdf8;color:#00111d}.seg-btn.feature::after{font-size:10px;top:-20px;left:24px}.seg-btn.feature.ramp{background:#22f36e}.seg-btn.feature.bus{background:#fb923c}.seg-btn.feature.shelter{background:#facc15}.seg-btn.feature.tactile{background:#a78bfa}
      .hud{position:absolute;z-index:20;border:1px solid var(--line);background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.38);backdrop-filter:blur(14px);border-radius:18px;color:var(--txt)}
      #topbar{top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;padding:10px 12px;z-index:30}.brand{font-weight:900;letter-spacing:.01em}.pill{border:1px solid rgba(148,163,184,.26);background:rgba(15,23,42,.78);border-radius:999px;padding:7px 10px;font-size:12px}.spacer{flex:1}
      button,select,input{border:1px solid rgba(125,211,252,.35);background:rgba(15,23,42,.88);color:var(--txt);border-radius:12px;padding:8px 10px;font-weight:750}button{cursor:pointer}button:hover,button.active{background:linear-gradient(135deg,#075985,#0e7490);border-color:#bae6fd}select{max-width:360px}
      #miniMap{position:absolute;right:14px;bottom:14px;width:240px;height:150px;border-radius:18px;overflow:hidden;z-index:22;border:1px solid rgba(125,211,252,.38);box-shadow:0 20px 60px rgba(0,0,0,.45);display:none}.street-mode #miniMap{display:block}#miniMap .label{position:absolute;left:8px;top:8px;background:rgba(2,6,23,.78);border-radius:999px;padding:4px 8px;font-size:11px;color:#bae6fd;z-index:2}
      #detailCard{left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));padding:12px 14px;z-index:26;display:none}#detailCard.visible{display:block}.street-mode #detailCard{bottom:18px}.detail-head{display:flex;gap:10px;align-items:center}.score{font-size:28px;font-weight:950}.title{font-weight:900}.sub{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:8px}.metric b{display:block}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.close{margin-left:auto;border-radius:999px;width:30px;height:30px;padding:0}
      #segmentButtons{position:absolute;inset:0;z-index:25;pointer-events:none}.seg-btn{position:absolute;pointer-events:auto;width:24px;height:24px;border-radius:999px;border:2px solid white;background:var(--blue);box-shadow:0 0 0 5px rgba(56,189,248,.24),0 8px 22px rgba(0,0,0,.45);color:#00111d;font-size:10px;font-weight:950;padding:0}.seg-btn.bad{background:var(--red)}.seg-btn.warn{background:var(--amber)}.seg-btn.addon::after{content:attr(data-addon);position:absolute;left:18px;top:-16px;background:rgba(2,6,23,.82);color:white;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 6px;font-size:9px;white-space:nowrap}
      #settings{right:14px;top:70px;width:min(390px,calc(100vw - 28px));padding:14px;z-index:35;display:none}#settings.visible{display:block}#settings textarea{width:100%;height:70px;border-radius:12px;background:#020617;color:#e0f2fe;border:1px solid rgba(125,211,252,.28)}#settings p{font-size:12px;color:var(--muted);line-height:1.35}.settings-grid{display:grid;grid-template-columns:1fr auto;gap:8px}.status{position:absolute;left:14px;bottom:14px;z-index:21;background:rgba(2,6,23,.82);border:1px solid rgba(125,211,252,.28);border-radius:999px;padding:8px 12px;font-size:12px;color:#dff7ff}.street-mode .status{display:none}
      @media(max-width:800px){#topbar{flex-wrap:wrap}select{max-width:100%;width:100%}.metrics{grid-template-columns:repeat(2,1fr)}#miniMap{display:none!important}}
    </style>
    <script src="https://unpkg.com/maptalks/dist/maptalks.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
  </head>
  <body>
    <div id="satelliteFallback" aria-hidden="true"></div>
    <div id="map"></div>
    <div id="threeOverlay"></div>
    <div id="mapillaryView"></div>
    <div id="segmentButtons"></div>
    <div id="topbar" class="hud">
      <div class="brand">EquiRoute Earth</div>
      <span class="pill" id="modeLabel">Esri/Maxar Earth satellite</span>
      <span class="pill" id="earthSource">daylight aerial imagery</span>
      <select id="segmentSelect" title="Choose a 5 m segment"></select>
      <button id="earthBtn" class="active">Earth Satellite</button>
      <button id="streetBtn">Street View</button>
      <button id="prevBtn">←</button><button id="nextBtn">→</button>
      <div class="spacer"></div>
      <span class="pill"><b id="segCount">–</b> segments</span>
      <span class="pill"><b id="buildingCount">–</b> buildings</span>
      <button id="settingsBtn">⚙</button>
    </div>
    <div id="settings" class="hud">
      <button class="close" id="closeSettings">×</button>
      <h3>Settings</h3>
      <p>Mapillary token, data-source notes, and standards references live here so the main demo stays clean.</p>
      <div class="settings-grid"><input id="mapillaryTokenInput" type="password" placeholder="Mapillary client token"/><button id="saveMapillaryTokenBtn">Save</button></div>
      <p id="tokenStatus"></p>
      <h4>References hidden from demo</h4>
      <p id="standardsText"></p>
    </div>
    <div id="miniMap"><div class="label">Earth context</div></div>
    <section id="detailCard" class="hud">
      <div class="detail-head"><div><div class="title" id="selectedName">Select a segment</div><div class="sub" id="selectedDesc"></div></div><div class="spacer"></div><div class="score" id="activeScore">–</div><button class="close" id="closeDetail">×</button></div>
      <div class="metrics" id="metricList"></div>
    </section>
    <div class="status" id="status">Loading Clementi digital twin…</div>
    <script>
      const COLORS={green:'#22f36e',amber:'#ffd166',red:'#ff3b52',blue:'#38bdf8',orange:'#fb923c'};
      const state={world:null,buildings:null,segments:[],features:[],selectedIndex:0,mode:'earth',mapillaryViewer:null,miniMap:null,layers:{},token:null,three:{},streetImages:[],streetImageIndex:0,currentStreetSegment:null,streetRegistry:null,streetNodeIndex:0,nodePhotoCache:{}};
      window.__EARTH_ACCESSIBILITY_STATE=state;
      const SATELLITE_TILE='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      const map=new maptalks.Map('map',{center:[103.7716,1.3062],zoom:17,pitch:0,bearing:0,baseLayer:new maptalks.TileLayer('satellite-daylight',{urlTemplate:SATELLITE_TILE,renderer:'canvas',attribution:'Tiles © Esri, Maxar, Earthstar Geographics'})});
      try{map.getBaseLayer()?.hide?.()}catch(e){console.warn('base layer hide fallback failed',e)}
      const routeLayer=new maptalks.VectorLayer('5m-accessibility-segments').addTo(map), poiLayer=new maptalks.VectorLayer('features').addTo(map), buildingLayer=new maptalks.VectorLayer('buildings').addTo(map), selectedLayer=new maptalks.VectorLayer('selected').addTo(map);state.layers={routeLayer,poiLayer,buildingLayer,selectedLayer};
      function getToken(){return localStorage.getItem('equiroute_mapillary_token')||''}function setToken(t){if((t||'').trim())localStorage.setItem('equiroute_mapillary_token',t.trim());updateSettings()}function setStatus(t){document.getElementById('status').textContent=t}function scoreColor(s){return s>=67?COLORS.green:s>=45?COLORS.amber:COLORS.red}function middle(f){const c=f.geometry.coordinates;return[(c[0][0]+c[c.length-1][0])/2,(c[0][1]+c[c.length-1][1])/2]}function bearing(a,b){const y=Math.sin((b[0]-a[0])*Math.PI/180)*Math.cos(b[1]*Math.PI/180);const x=Math.cos(a[1]*Math.PI/180)*Math.sin(b[1]*Math.PI/180)-Math.sin(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.cos((b[0]-a[0])*Math.PI/180);return Math.atan2(y,x)*180/Math.PI}function centroid(r){let x=0,y=0,n=r.length||1;r.forEach(c=>{x+=c[0];y+=c[1]});return[x/n,y/n]}

      function lonLatToTile(lon,lat,z){const n=2**z;const x=(lon+180)/360*n;const rad=lat*Math.PI/180;const y=(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n;return{x,y}}
      function tileToLonLat(x,y,z){const n=2**z;const lon=x/n*360-180;const lat=Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;return[lon,lat]}
      function renderSatelliteFallback(){const box=document.getElementById('satelliteFallback');if(!box)return;const center=map.getCenter(),z=Math.max(15,Math.min(19,Math.round(map.getZoom()||17)));const w=innerWidth,h=innerHeight,tile=256;const c=lonLatToTile(center.x,center.y,z);const cols=Math.ceil(w/tile)+3,rows=Math.ceil(h/tile)+3;const startX=Math.floor(c.x-cols/2),startY=Math.floor(c.y-rows/2);const frag=document.createDocumentFragment();box.innerHTML='';for(let dx=0;dx<cols;dx++){for(let dy=0;dy<rows;dy++){const x=startX+dx,y=startY+dy;if(y<0||y>=2**z)continue;const img=document.createElement('img');img.loading='eager';img.decoding='async';img.src=SATELLITE_TILE.replace('{z}',z).replace('{y}',y).replace('{x}',x);img.style.left=Math.round(w/2+(x-c.x)*tile)+'px';img.style.top=Math.round(h/2+(y-c.y)*tile)+'px';frag.appendChild(img)}}box.appendChild(frag)}
      function addonFor(p){const m=p.metrics||{};if(m.near_bus_stop_m!=null&&m.near_bus_stop_m<18)return'bus stop';if(m.kerb_ramp_present)return'ramp';if(m.covered)return'shelter';if(m.tactile_guidance)return'tactile';return''}
      function renderBuildings(g){const geoms=g.features.map(f=>f.geometry?.type==='Polygon'?new maptalks.Polygon(f.geometry.coordinates,{symbol:{polygonFill:'#ffffff',polygonOpacity:.015,lineColor:'rgba(255,255,255,.13)',lineWidth:.25}}):null).filter(Boolean);buildingLayer.addGeometry(geoms);document.getElementById('buildingCount').textContent=geoms.length.toLocaleString()}
      function initThreeOverlay(){const box=document.getElementById('threeOverlay');const w=box.clientWidth||innerWidth,h=box.clientHeight||innerHeight;try{const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(0,w,h,0,-1000,1000);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h);box.innerHTML='';box.appendChild(renderer.domElement);state.three={scene,camera,renderer,agents:[],route:null,ramps:[],clock:new THREE.Clock(),pathPoints:[],webgl:true};animateThreeOverlay();}catch(err){console.warn('Three.js WebGL overlay unavailable in this browser; using DOM segment controls only',err);state.three={webgl:false,error:err.message};}}
      function makeAgent(color,type){const g=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color});const dark=new THREE.MeshBasicMaterial({color:0x07111f});if(type==='wheelchair'){g.add(new THREE.Mesh(new THREE.SphereGeometry(6,18,18),mat));const a=new THREE.Mesh(new THREE.BoxGeometry(16,7,10),mat);a.position.set(0,-8,0);g.add(a);const w1=new THREE.Mesh(new THREE.TorusGeometry(7,1.4,8,24),dark);w1.position.set(-7,0,0);const w2=w1.clone();w2.position.set(7,0,0);g.add(w1,w2);}else{g.add(new THREE.Mesh(new THREE.BoxGeometry(24,9,10),mat));const head=new THREE.Mesh(new THREE.SphereGeometry(5,16,16),mat);head.position.set(-5,-10,0);g.add(head);const w1=new THREE.Mesh(new THREE.TorusGeometry(5,1.1,8,18),dark);w1.position.set(-8,7,0);const w2=w1.clone();w2.position.set(9,7,0);g.add(w1,w2);}g.scale.setScalar(1.15);return g;}
      function screenPoint(coord){const p=map.coordinateToContainerPoint(new maptalks.Coordinate(coord[0],coord[1]));return new THREE.Vector3(p.x,p.y,0)}
      function updateThreeOverlay(){if(!state.three.renderer||state.mode!=='earth'||!state.segments.length)return;const t=state.three,scene=t.scene;[t.route,...t.agents,...t.ramps].filter(Boolean).forEach(o=>scene.remove(o));t.agents=[];t.ramps=[];const f=state.segments[state.selectedIndex],near=nearbySegments(f,7);const pts=[];near.slice(0,5).forEach(seg=>seg.geometry.coordinates.forEach(c=>pts.push(screenPoint(c))));t.pathPoints=pts.length>1?pts:[screenPoint(f.geometry.coordinates[0]),screenPoint(f.geometry.coordinates.at(-1))];const curve=new THREE.CatmullRomCurve3(t.pathPoints);t.route=new THREE.Mesh(new THREE.TubeGeometry(curve,96,5,12,false),new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:.8}));scene.add(t.route);const glow=new THREE.PointLight(0x38bdf8,1,90);glow.position.copy(t.pathPoints[0]);scene.add(glow);t.ramps.push(glow);near.forEach(seg=>{const p=seg.properties,add=addonFor(p);if(!add)return;const mid=screenPoint(middle(seg));const ramp=new THREE.Mesh(new THREE.BoxGeometry(30,12,10),new THREE.MeshBasicMaterial({color:add==='ramp'?0x22f36e:add==='bus stop'?0xfb923c:0xfacc15,transparent:true,opacity:.88}));ramp.position.copy(mid);ramp.rotation.z=.35;scene.add(ramp);t.ramps.push(ramp);});const a1=makeAgent(0x22f36e,'wheelchair'),a2=makeAgent(0x60a5fa,'pma');scene.add(a1,a2);t.agents.push(a1,a2);}
      function animateThreeOverlay(){const t=state.three;if(!t.renderer)return;requestAnimationFrame(animateThreeOverlay);const w=threeOverlay.clientWidth||innerWidth,h=threeOverlay.clientHeight||innerHeight;if(t.renderer.domElement.width!==Math.round(w*devicePixelRatio)||t.renderer.domElement.height!==Math.round(h*devicePixelRatio)){t.renderer.setSize(w,h,false);t.camera.right=w;t.camera.bottom=h;t.camera.updateProjectionMatrix();}if(state.mode==='earth'&&t.pathPoints?.length>1){const elapsed=performance.now()/1000;t.agents.forEach((a,i)=>{const phase=(elapsed*.18+i*.42)%1;const idx=Math.floor(phase*(t.pathPoints.length-1));const next=Math.min(idx+1,t.pathPoints.length-1);const local=phase*(t.pathPoints.length-1)-idx;const p=t.pathPoints[idx].clone().lerp(t.pathPoints[next],local);a.position.copy(p);a.position.z=40+i*8;a.rotation.z=Math.sin(elapsed*2+i)*.12;});}t.renderer.render(t.scene,t.camera);}
      function renderWorld(world){state.segments=world.features.filter(f=>f.properties.kind==='route_segment'&&f.properties.feature_type!=='kerb_line');state.features=world.features.filter(f=>f.properties.kind!=='route_segment');const allRoutes=world.features.filter(f=>f.properties.kind==='route_segment');const routeGeoms=allRoutes.map((f,i)=>{const selectable=f.properties.feature_type!=='kerb_line';const selectableIndex=selectable?state.segments.indexOf(f):-1;return new maptalks.LineString(f.geometry.coordinates,{properties:{...f.properties,index:selectableIndex},symbol:{lineColor:selectable?scoreColor(f.properties.overall_accessibility_score):'#94a3b8',lineWidth:f.properties.feature_type==='kerb_line'?1.4:4,lineOpacity:f.properties.feature_type==='kerb_line'?.28:.88}}).on('click',()=>{if(selectable){state.mode='street';selectSegment(selectableIndex,true)}})});routeLayer.addGeometry(routeGeoms);const poi=state.features.map(f=>{const p=f.properties;const coord=f.geometry.type==='Point'?f.geometry.coordinates:centroid(f.geometry.coordinates[0]);const label=p.kind==='bus_stop'?'BUS':p.kind==='mrt_station'?'MRT':p.kind==='covered_linkway'?'shelter':p.kind==='pedestrian_overhead_bridge'?'bridge':p.kind==='bollard'?'bollard':'';return new maptalks.Marker(coord,{symbol:[{markerType:'ellipse',markerFill:p.kind==='bollard'?COLORS.red:COLORS.orange,markerLineColor:'#fff',markerLineWidth:1,markerWidth:p.kind==='mrt_station'?22:14,markerHeight:p.kind==='mrt_station'?22:14},{textName:label,textSize:10,textFill:'#fff',textHaloFill:'#020617',textHaloRadius:2,textDy:-18}]})});poiLayer.addGeometry(poi);document.getElementById('segCount').textContent=state.segments.length.toLocaleString();document.getElementById('standardsText').textContent=[world.standards?.name,...(world.standards?.basis||[])].join(' · ');initThreeOverlay();populateSelect();selectSegment(0,false);detailCard.classList.remove('visible')}
      function populateSelect(){segmentSelect.innerHTML=state.segments.map((f,i)=>`<option value="${i}">${f.properties.name} · ${Math.round(f.properties.metrics.length_m)}m · ${f.properties.overall_accessibility_score}</option>`).join('')} 
      function showDetail(p){detailCard.classList.add('visible');selectedName.textContent=`${p.name} · ${p.feature_type.replaceAll('_',' ')}`;selectedDesc.textContent=`${Math.round(p.metrics.length_m*10)/10} m segment${addonFor(p)?' · '+addonFor(p):''}`;activeScore.textContent=p.overall_accessibility_score;const m=p.metrics,c=p.component_scores;metricList.innerHTML=[['Width',m.clear_width_m+' m',c.clear_width],['Slope',m.running_slope_pct+'%',c.running_slope],['Cross slope',m.cross_slope_pct+'%',c.cross_slope],['Roughness',m.roughness_mm+' mm',c.surface_roughness],['Level change',m.vertical_change_mm+' mm',c.vertical_change],['Obstructions',m.obstruction_count,c.obstructions],['Shelter',m.covered?'yes':'no',c.shelter],['Tactile',m.tactile_guidance?'yes':'unknown',c.tactile_guidance]].map(x=>`<div class="metric"><span>${x[0]}</span><b style="color:${scoreColor(x[2])}">${x[1]}</b><small>${x[2]}/100</small></div>`).join('')}
      function selectSegment(index,street=false){if(!state.segments.length)return;state.selectedIndex=(index+state.segments.length)%state.segments.length;const f=state.segments[state.selectedIndex],p=f.properties,coords=f.geometry.coordinates;segmentSelect.value=state.selectedIndex;selectedLayer.clear();selectedLayer.addGeometry(new maptalks.LineString(coords,{symbol:{lineColor:COLORS.blue,lineWidth:10,lineOpacity:.98}}));showDetail(p);const mid=middle(f),brg=bearing(coords[0],coords[coords.length-1]);if(street){enterStreet(f,mid,brg)}else{enterEarth();map.animateTo({center:mid,zoom:18,pitch:0,bearing:0},{duration:500});renderSegmentButtons();setTimeout(()=>{renderSatelliteFallback();updateThreeOverlay()},520)}}
      async function findMapillaryImages(coord,limit=6){const token=getToken();if(!token)throw new Error('no token');const url=`https://graph.mapillary.com/images?fields=id,is_pano,thumb_2048_url,thumb_1024_url,thumb_256_url,geometry,computed_geometry,compass_angle,computed_compass_angle&lat=${coord[1]}&lng=${coord[0]}&radius=50&limit=${limit}&access_token=${encodeURIComponent(token)}`;const data=await fetch(url).then(r=>{if(!r.ok)throw new Error('Mapillary '+r.status);return r.json()});return data.data||[]}
      async function findStreetImagesForSegment(f,desiredHeading=null){const origin=middle(f);const nearby=nearbySegments(f,36).map(middle);const points=[origin,...nearby].filter((pt,i,a)=>a.findIndex(x=>Math.abs(x[0]-pt[0])<1e-7&&Math.abs(x[1]-pt[1])<1e-7)===i);const seen=new Set(),out=[];for(const pt of points){try{for(const img of await findMapillaryImages(pt,8)){if(img?.id&&!seen.has(img.id)){seen.add(img.id);out.push(img)}}}catch(e){console.warn('Mapillary point failed',e)}if(out.length>=18)break}if(desiredHeading!=null){out.sort((a,b)=>{const ah=Number(a.computed_compass_angle??a.compass_angle??desiredHeading),bh=Number(b.computed_compass_angle??b.compass_angle??desiredHeading);const ad=Math.abs(normAngle(ah-desiredHeading)),bd=Math.abs(normAngle(bh-desiredHeading));const ap=a.is_pano?-8:0,bp=b.is_pano?-8:0;return (ad+ap)-(bd+bp)})}return out}
      function renderStreetPhoto(index=0){const imgs=state.streetImages||[];state.streetImageIndex=(index+imgs.length)%Math.max(1,imgs.length);const img=imgs[state.streetImageIndex];if(!img){mapillaryView.innerHTML='<div class="street-note">No Mapillary photo here yet, showing Esri/Maxar Earth satellite underlay. Choose another footpath or paste token in ⚙.</div>';earthSource.textContent='street fallback: Esri/Maxar satellite underlay';return}const thumb=img.thumb_2048_url||img.thumb_1024_url||img.thumb_256_url;if(!thumb){mapillaryView.innerHTML='<div class="street-note">Mapillary image has no usable thumbnail, showing Earth satellite underlay.</div>';return}mapillaryView.innerHTML=`<img id="streetPhoto" src="${thumb}" alt="Mapillary street-level image"/>`;state.mapillaryImageId=img.id;earthSource.textContent=`Mapillary ${state.streetImageIndex+1}/${imgs.length} · geo-anchored feature pins`;setTimeout(()=>renderSegmentButtons(true),120)}
      function cycleStreetPhoto(delta){if(state.mode==='street'&&(state.streetImages||[]).length>1){renderStreetPhoto(state.streetImageIndex+delta);return true}return false}
      async function enterStreet(f,coord,brg){state.currentStreetSegment=f;syncStreetNodeToSegment(f);const node=currentStreetNode();const desiredHeading=node?.canonical_heading_deg??brg;state.mode='street';document.body.classList.add('street-mode');earthBtn.classList.remove('active');streetBtn.classList.add('active');modeLabel.textContent='street view · accessibility features';earthSource.textContent='loading Mapillary photos, Earth satellite stays behind';map.animateTo({center:coord,zoom:20,pitch:78,bearing:brg},{duration:350});setupMiniMap();mapillaryView.innerHTML='<div class="street-note">Searching Mapillary photos, Earth satellite remains visible behind this layer…</div>';try{if(node&&state.nodePhotoCache[node.id]){state.streetImages=state.nodePhotoCache[node.id]}else{state.streetImages=await findStreetImagesForSegment(f,desiredHeading);if(node)state.nodePhotoCache[node.id]=state.streetImages}state.streetImageIndex=0;renderStreetPhoto(0)}catch(e){console.warn('Mapillary unavailable',e);state.streetImages=[];renderStreetPhoto(0)}renderSegmentButtons(true)}
      function enterEarth(){state.mode='earth';document.body.classList.remove('street-mode');earthBtn.classList.add('active');streetBtn.classList.remove('active');modeLabel.textContent='Esri/Maxar Earth satellite · Three.js overlay';earthSource.textContent='real daylight aerial tiles, not grey blocks';if(state.mapillaryViewer){try{state.mapillaryViewer.remove()}catch(e){}state.mapillaryViewer=null}map.setPitch(0);map.setBearing(0);renderSegmentButtons(false);renderSatelliteFallback();setTimeout(updateThreeOverlay,80)}
      function setupMiniMap(){if(state.miniMap)return;state.miniMap=new maptalks.Map('miniMap',{center:map.getCenter(),zoom:18,pitch:0,bearing:0,baseLayer:new maptalks.TileLayer('miniBase',{urlTemplate:SATELLITE_TILE,renderer:'canvas'})});new maptalks.VectorLayer('mini-segments',routeLayer.getGeometries().map(g=>g.copy())).addTo(state.miniMap);state.miniMap.on('click',e=>{const c=[e.coordinate.x,e.coordinate.y];let best=0,bd=Infinity;state.segments.forEach((f,i)=>{const m=middle(f),d=Math.hypot((m[0]-c[0])*111320,(m[1]-c[1])*111320);if(d<bd){bd=d;best=i}});selectSegment(best,true)})}
      function featureComment(p,kind){const score=p.overall_accessibility_score;const m=p.metrics||{};if(kind==='bus stop')return `Bus stop access: ${score}/100. Check boarding gap, shelter, obstruction and waiting-area width.`;if(kind==='ramp')return `Ramp/kerb transition: ${score}/100. Key risks are level change ${m.vertical_change_mm}mm and slope ${m.running_slope_pct}%.`;if(kind==='shelter')return `Sheltered section: ${score}/100. Comfort improves, still check clear width ${m.clear_width_m}m.`;if(kind==='tactile')return `Tactile/wayfinding cue: ${score}/100. Helps visually impaired users; verify continuity and crossing safety.`;return `Accessibility feature: ${score}/100.`}
      function showFeatureForSegment(idx,kind){const f=state.segments[idx],p=f.properties;showDetail(p);selectedDesc.textContent=featureComment(p,kind);activeScore.textContent=p.overall_accessibility_score;detailCard.classList.add('visible')}
      function normAngle(a){return ((a+540)%360)-180}function distM(a,b){return Math.hypot((a[0]-b[0])*111320*Math.cos(((a[1]+b[1])/2)*Math.PI/180),(a[1]-b[1])*111320)}
      function imageCoord(img){const g=img?.computed_geometry||img?.geometry;return g?.coordinates?.length>=2?g.coordinates:null}
      function pointForFeature(f){if(f?.geometry?.type==='Point')return f.geometry.coordinates;if(f?.geometry?.type==='LineString')return middle(f);if(f?.geometry?.type==='Polygon')return centroid(f.geometry.coordinates[0]);return null}
      function projectToStreetPhoto(coord,kind,ordinal=0){const img=(state.streetImages||[])[state.streetImageIndex]||{},origin=imageCoord(img)||middle(state.currentStreetSegment||state.segments[state.selectedIndex]);const heading=Number(img.computed_compass_angle??img.compass_angle??bearing((state.currentStreetSegment||state.segments[state.selectedIndex]).geometry.coordinates[0],(state.currentStreetSegment||state.segments[state.selectedIndex]).geometry.coordinates.at(-1)));const d=distM(origin,coord),brg=bearing(origin,coord),delta=normAngle(brg-heading),fov=105;let x=.5+delta/fov;x=Math.max(.07,Math.min(.93,x));let y=.80-Math.min(d,95)/190;if(Math.abs(delta)>82)y=.62;if(kind==='bus stop'||kind==='mrt')y-=.04;if(kind==='shelter')y-=.01;if(kind==='walkway')y=.76;if(kind==='ramp'||kind==='tactile')y+=.04;y=Math.max(.38,Math.min(.84,y));return{x:x*innerWidth,y:y*innerHeight,d,delta,visible:Math.abs(delta)<=82}}
      function streetFeatureCandidates(selected){const img=(state.streetImages||[])[state.streetImageIndex]||{},origin=imageCoord(img)||middle(selected),items=[],seen=new Set();function add(it){const key=it.kind+':'+it.coord.map(v=>v.toFixed(5)).join(',');if(!seen.has(key)){seen.add(key);items.push(it)}}state.segments.forEach(f=>{const coord=middle(f),d=distM(coord,origin);if(d<120){const kind=addonFor(f.properties);if(kind)add({kind,f,coord,score:f.properties.overall_accessibility_score,label:kind})}});state.features.forEach(f=>{const p=f.properties||{},kind=p.kind==='bus_stop'?'bus stop':p.kind==='mrt_station'?'mrt':p.kind==='covered_linkway'?'shelter':p.kind==='pedestrian_overhead_bridge'?'walkway':p.kind==='bollard'?'obstruction':'';if(!kind)return;const coord=pointForFeature(f),d=coord?distM(coord,origin):999;if(coord&&d<150)add({kind,f:null,coord,score:kind==='obstruction'?45:kind==='mrt'?88:82,label:kind,name:p.name||kind})});add({kind:'walkway',f:selected,coord:middle(selected),score:selected.properties.overall_accessibility_score,label:'walkway'});const placed=[];return items.map((it,i)=>({...it,pt:projectToStreetPhoto(it.coord,it.kind,i)})).filter(it=>it.pt).sort((a,b)=>(b.pt.visible-a.pt.visible)||(a.pt.d-b.pt.d)).filter((it)=>{const limit={"bus stop":4,mrt:2,walkway:2,shelter:3,ramp:2,tactile:2,obstruction:1}[it.kind]||2;const c=placed.filter(p=>p.kind===it.kind).length;if(c>=limit)return false;placed.push({kind:it.kind,x:-999,y:-999});return true}).slice(0,10).map((it,i)=>{for(const p of placed){if(p.x>-100&&Math.hypot(it.pt.x-p.x,it.pt.y-p.y)<54){it.pt.y+=((i%3)-1)*38;it.pt.x+=(i%2?1:-1)*28}}it.pt.x=Math.max(48,Math.min(innerWidth-48,it.pt.x));it.pt.y=Math.max(150,Math.min(innerHeight-115,it.pt.y));placed.push({kind:it.kind,x:it.pt.x,y:it.pt.y});return it})}
      function renderSegmentButtons(street=false){segmentButtons.innerHTML='';const selected=state.segments[state.selectedIndex];if(!selected)return;if(street){streetFeatureCandidates(selected).forEach((x,n)=>{const idx=x.f?state.segments.indexOf(x.f):state.selectedIndex,kind=x.kind,pt=x.pt;const b=document.createElement('button');b.className=`seg-btn feature ${kind.includes('bus')?'bus':kind}`;b.dataset.addon=kind;b.style.left=(pt.x-17)+'px';b.style.top=(pt.y-17)+'px';b.textContent=kind==='bus stop'?'B':kind==='mrt'?'M':kind==='walkway'?'W':kind==='ramp'?'R':kind==='shelter'?'S':kind==='obstruction'?'!':'T';b.title=x.f?featureComment(x.f.properties,kind):`${kind} near this photo · ${Math.round(pt.d)}m away`;b.onclick=()=>x.f?showFeatureForSegment(idx,kind):(selectedDesc.textContent=`${kind} near this street image, approximately ${Math.round(pt.d)}m away from the camera direction.`,activeScore.textContent=x.score,detailCard.classList.add('visible'));segmentButtons.appendChild(b)});return}let candidates=state.segments.filter((_,i)=>i%12===0).slice(0,180);candidates.forEach(f=>{const idx=state.segments.indexOf(f),p=f.properties,pt=map.coordinateToContainerPoint(new maptalks.Coordinate(...middle(f)));const b=document.createElement('button');b.className='seg-btn '+(p.overall_accessibility_score<45?'bad':p.overall_accessibility_score<67?'warn':'');const add=addonFor(p);if(add){b.classList.add('addon');b.dataset.addon=add}b.style.left=(pt.x-12)+'px';b.style.top=(pt.y-12)+'px';b.textContent=idx===state.selectedIndex?'●':'';b.title=`${p.name} ${p.overall_accessibility_score}/100`;b.onclick=()=>selectSegment(idx,false);segmentButtons.appendChild(b)})}
      function nearbySegments(base,n){const c=middle(base);return state.segments.map(f=>({f,d:Math.hypot((middle(f)[0]-c[0])*111320,(middle(f)[1]-c[1])*111320)})).sort((a,b)=>a.d-b.d).slice(0,n).map(x=>x.f)}

      function segmentIndexForStreetPart(part){if(!part)return-1;const ids=new Set(part.route_segment_ids||[]);let idx=state.segments.findIndex(f=>ids.has(f.properties.id));if(idx<0&&part.midpoint){idx=state.segments.map((f,i)=>({i,d:distM(middle(f),part.midpoint)})).sort((a,b)=>a.d-b.d)[0]?.i??-1}return idx}
      function currentStreetNode(){return state.streetRegistry?.street_view_nodes?.[state.streetNodeIndex]||null}
      function syncStreetNodeToSegment(f){const segId=f?.properties?.id,parts=state.streetRegistry?.street_parts||[],nodes=state.streetRegistry?.street_view_nodes||[];if(!segId||!parts.length)return;const part=parts.find(p=>(p.route_segment_ids||[]).includes(segId));if(!part)return;const nodeIdx=nodes.findIndex(n=>n.street_part_id===part.id);if(nodeIdx>=0)state.streetNodeIndex=nodeIdx}
      function selectStreetNode(nodeIndex){const nodes=state.streetRegistry?.street_view_nodes||[],parts=state.streetRegistry?.street_parts||[];if(!nodes.length)return false;state.streetNodeIndex=Math.max(0,Math.min(nodes.length-1,nodeIndex));const node=nodes[state.streetNodeIndex],part=parts.find(p=>p.id===node.street_part_id);const idx=segmentIndexForStreetPart(part);if(idx>=0){selectSegment(idx,true);return true}return false}
      function moveStreetNode(delta){const node=currentStreetNode(),nodes=state.streetRegistry?.street_view_nodes||[];if(!node||!nodes.length)return false;const targetId=delta>0?node.next_node_id:node.prev_node_id;if(!targetId)return false;const targetIdx=nodes.findIndex(n=>n.id===targetId);return targetIdx>=0?selectStreetNode(targetIdx):false}
      function updateSettings(){tokenStatus.textContent=getToken()?'Mapillary token saved in this browser.':'No Mapillary token saved; street view may be unavailable.'}
      segmentSelect.onchange=e=>selectSegment(Number(e.target.value),state.mode==='street');prevBtn.onclick=()=>{if(state.mode==='street'){if(!moveStreetNode(-1)&&!cycleStreetPhoto(-1))selectSegment(state.selectedIndex-1,true)}else selectSegment(state.selectedIndex-1,false)};nextBtn.onclick=()=>{if(state.mode==='street'){if(!moveStreetNode(1)&&!cycleStreetPhoto(1))selectSegment(state.selectedIndex+1,true)}else selectSegment(state.selectedIndex+1,false)};earthBtn.onclick=()=>selectSegment(state.selectedIndex,false);streetBtn.onclick=()=>selectSegment(state.selectedIndex,true);settingsBtn.onclick=()=>settings.classList.toggle('visible');closeSettings.onclick=()=>settings.classList.remove('visible');closeDetail.onclick=()=>detailCard.classList.remove('visible');saveMapillaryTokenBtn.onclick=()=>setToken(mapillaryTokenInput.value);map.on('moving zooming resize viewchange',()=>{renderSatelliteFallback();if(state.mode==='earth'){renderSegmentButtons(false);updateThreeOverlay();}});window.addEventListener('resize',()=>{renderSatelliteFallback();renderSegmentButtons(state.mode==='street')});
      Promise.all([fetch('accessibility_world.geojson').then(r=>r.json()),fetch('buildings_clementi.geojson').then(r=>r.json()),fetch('data/street_view_registry.json').then(r=>r.ok?r.json():null).catch(()=>null)]).then(([world,buildings,registry])=>{state.world=world;state.buildings=buildings;state.streetRegistry=registry;renderBuildings(buildings);renderWorld(world);const ext=routeLayer.getExtent();if(ext)map.fitExtent(ext,0,{animation:false});map.setPitch(0);map.setBearing(0);renderSatelliteFallback();setStatus(`Loaded ${state.segments.length.toLocaleString()} 5 m segments, ${buildings.features.length.toLocaleString()} buildings`);updateSettings()}).catch(e=>setStatus('Failed to load: '+e.message));
    </script>
