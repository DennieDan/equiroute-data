name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage site (repo root layout)
        run: |
          mkdir -p _site/data _site/web
          cp *.html _site/
          cp -f harvard.css _site/
          cp accessibility_world.geojson buildings_clementi.geojson _site/
          cp -R data/. _site/data/
          cp -R assets _site/assets
          # shared / optional root scripts
          cp -f feedback-form.js sha256.js _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
