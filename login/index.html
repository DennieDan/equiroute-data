<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <link rel="apple-touch-icon" href="../assets/jalanlens-icon-192.png" />
    <title>Log In | JalanLens</title>
    <style>
      :root {
        --bg: #020617;
        --card: rgba(15, 23, 42, 0.88);
        --line: rgba(125, 211, 252, 0.28);
        --txt: #e0f2fe;
        --muted: #94a3b8;
        --blue: #38bdf8;
        --green: #22c55e;
        --red: #fb7185;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.16), transparent 30%),
          radial-gradient(circle at 80% 90%, rgba(34, 197, 94, 0.13), transparent 34%),
          var(--bg);
        color: var(--txt);
        font-family: var(--harvard-sans);
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.26), transparent 30%),
          linear-gradient(180deg, rgba(2, 6, 23, 0.32), rgba(2, 6, 23, 0.72)),
          rgba(2, 6, 23, 0.38);
        backdrop-filter: saturate(1.08);
      }
      .login-bg-video {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: saturate(1.08) contrast(1.04) brightness(0.78);
      }
      main {
        position: relative;
        z-index: 2;
        width: min(760px, 100%);
      }
      h1 { margin: 0 0 24px; text-align: center; font-size: clamp(34px, 7vw, 64px); line-height: 0.95; text-shadow: 0 0 38px rgba(56, 189, 248, 0.35); }
      .roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .role {
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 24px;
        background: var(--card);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        text-align: center;
      }
      .role h2 { margin: 0 0 18px; font-size: 28px; text-transform: capitalize; }
      button, a.button {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 10px;
        border: 1px solid rgba(125, 211, 252, 0.36);
        border-radius: 15px;
        padding: 11px 13px;
        background: rgba(2, 6, 23, 0.72);
        color: var(--txt);
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
      }
      button.primary { background: linear-gradient(135deg, #075985, #0e7490); border-color: #bae6fd; }
      button.google {
        position: relative !important;
        min-height: 48px !important;
        justify-content: center !important;
        background: #ffffff !important;
        color: #1f1f1f !important;
        border: 1px solid #747775 !important;
        border-radius: 14px !important;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08) !important;
        font-family: var(--harvard-sans) !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        letter-spacing: 0.01em !important;
        gap: 12px !important;
        transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease !important;
      }
      button.google:hover {
        background: #f8fafd !important;
        border-color: #5f6368 !important;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.18) !important;
        transform: translateY(-1px) !important;
      }
      button.google:active { background: #f1f3f4 !important; transform: translateY(0) !important; }
      .google-g {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        display: block;
      }
      .google-label { line-height: 20px; }
      button.ghost { background: transparent; }
      #authPanel {
        display: none;
        margin: 18px auto 0;
        width: min(430px, 100%);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        background: rgba(15, 23, 42, 0.94);
      }
      #authPanel.visible { display: block; }
      #panelTitle { margin: 0 0 12px; font-size: 24px; text-transform: capitalize; text-align: center; }
      label { display: block; margin-top: 12px; color: #bae6fd; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
      input { width: 100%; margin-top: 6px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(2, 6, 23, 0.75); color: var(--txt); font-weight: 750; }
      #status { min-height: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }
      #status.ok { color: var(--green); }
      #status.err { color: var(--red); }
      @media (max-width: 720px) { .roles { grid-template-columns: 1fr; } }
      body.mobile-apk .role-select-label,
      body.mobile-apk #roleSelect { display: none; }
      body.mobile-apk .login-card::after {
        content: "Public mobile app";
        display: block;
        margin-top: 12px;
        color: #bae6fd;
        font-size: 12px;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
    <link rel="stylesheet" href="../harvard.css?v=20260731o" />
    <style>
      body:has(.login-bg-video) button.google {
        justify-content: center !important;
        background: #ffffff !important;
        color: #1f1f1f !important;
        border: 1px solid #747775 !important;
        border-radius: 14px !important;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08) !important;
        font-family: var(--harvard-sans) !important;
      }
      body:has(.login-bg-video) button.google:hover {
        background: #f8fafd !important;
        border-color: #5f6368 !important;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.18) !important;
      }
      body:has(.login-bg-video) button.google::after { content: none !important; }
    </style>
  </head>
  <body>
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="../" aria-label="JalanLens home">
        <img src="../assets/jalanlens-logo.png" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="../about/">About Us</a>
        <a href="../login/" aria-current="page">Log In</a>
      </nav>
    </header>
    <video class="login-bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true" poster="">
      <source src="../assets/login-singapore-city.mp4" type="video/mp4" />
    </video>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <p class="eyebrow">Secure access</p>
        <h1 id="loginTitle">Log in to JalanLens</h1>
        <label for="roleSelect" class="role-select-label">Choose role</label>
        <select id="roleSelect" class="role-select">
          <option value="public">Public user</option>
          <option value="authority">Authority user</option>
        </select>
        <button class="primary" id="openLoginBtn" type="button">Log In</button>
        <p class="signup-prompt">Don’t have an account?</p>
        <button class="ghost" id="openSignupBtn" type="button">Sign up now</button>
        <div class="or-divider"><span>or</span></div>
        <button class="google" id="googlePublicBtn" type="button" aria-label="Continue with Google">
          <svg class="google-g" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.614z" />
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.908-2.258c-.806.54-1.837.859-3.048.859-2.344 0-4.328-1.583-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
            <path fill="#FBBC05" d="M3.964 10.709A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.171.282-1.709V4.959H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.824.957 4.041l3.007-2.332z" />
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.582C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.959l3.007 2.332C4.672 5.163 6.656 3.58 9 3.58z" />
          </svg>
          <span class="google-label">Continue with Google</span>
        </button>
      </section>

      <div id="authOverlay" class="auth-overlay" aria-hidden="true">
        <section id="authPanel" aria-live="polite" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
          <button class="modal-close" id="backBtn" type="button" aria-label="Close login panel">×</button>
          <h2 id="panelTitle">Login</h2>
          <form id="authForm">
            <label for="username">Username</label>
            <input id="username" name="username" required maxlength="80" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="4" autocomplete="current-password" />
            <button class="primary" id="submitBtn" type="submit">Login</button>
            <button class="ghost" id="switchModeBtn" type="button">Sign up instead</button>
          </form>
          <div id="status"></div>
        </section>
      </div>
    </main>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
      import { sha256 } from "../sha256.js";

      const SB_URL = "https://khddsjemkdcgumfvkraa.supabase.co";
      const SB_KEY = "sb_publishable_" + "lqGtwkNAOMV7qsYPKVZr8w_GytZx3Qm";
      const ROLE_STORAGE_KEY = "jalanlens_role";
      const USER_STORAGE_KEY = "jalanlens_user";
      const params = new URLSearchParams(location.search);
      const supabase = createClient(SB_URL, SB_KEY);
      const isMobileApk = params.get("mobile") === "apk";
      if (isMobileApk) document.body.classList.add("mobile-apk");
      let activeRole = "public";
      let activeMode = "login";
      const authPanel = document.getElementById("authPanel");
      const authOverlay = document.getElementById("authOverlay");
      const roleSelect = document.getElementById("roleSelect");
      const panelTitle = document.getElementById("panelTitle");
      const authForm = document.getElementById("authForm");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const submitBtn = document.getElementById("submitBtn");
      const switchModeBtn = document.getElementById("switchModeBtn");
      const backBtn = document.getElementById("backBtn");
      const googlePublicBtn = document.getElementById("googlePublicBtn");
      const openLoginBtn = document.getElementById("openLoginBtn");
      const openSignupBtn = document.getElementById("openSignupBtn");
      const statusEl = document.getElementById("status");
      if (isMobileApk) {
        roleSelect.value = "public";
        activeRole = "public";
        [...roleSelect.options].forEach((option) => { if (option.value !== "public") option.remove(); });
      }

      const headers = (extra = {}) => ({ ...extra, ["api" + "key"]: SB_KEY, ["Author" + "ization"]: "Bearer " + SB_KEY });
      const setStatus = (msg, kind = "") => { statusEl.textContent = msg; statusEl.className = kind; };
      const slug = (value) => value.trim().toLowerCase().replace(/[^a-z0-9._-]+/g, ".").replace(/^\.+|\.+$/g, "").slice(0, 72);
      const titleCase = (value) => String(value || "").replace(/\b\w/g, (c) => c.toUpperCase());
      const DEMO_ACCOUNTS = {
        public: {
          "nurul.public": "public_wheelchair_commuter",
          "tan.public": "public_senior_walker",
          "aisha.public": "public_low_vision_commuter",
          "google.public.demo": "google_public_demo",
        },
        authority: {
          "lta.planner": "authority_lta_planner",
          "towncouncil.officer": "authority_town_council",
          "sbs.operator": "authority_sbs_operator",
        },
      };

      function safeNext() {
        const raw = params.get("next") || "../street-intelligence/";
        let target;
        try { target = new URL(raw, location.href); } catch (e) { target = new URL("../street-intelligence/", location.href); }
        if (target.origin !== location.origin) target = new URL("../street-intelligence/", location.href);
        const path = target.pathname.replace(/\/index\.html$/, "/");
        if (path.endsWith("/street-intelligence/") || path.endsWith("/profile/") || path.endsWith("/documentation/") || path.endsWith("/crowd-photos/")) {
          if (isMobileApk && path.endsWith("/street-intelligence/")) target.searchParams.set("mobile", "apk");
          return path.replace(location.origin, "") + target.search;
        }
        if (path.endsWith("earth_accessibility.html")) return "../street-intelligence/" + (isMobileApk ? "?mobile=apk" : target.search);
        return "../street-intelligence/" + (isMobileApk ? "?mobile=apk" : "");
      }

      function enter(user) {
        localStorage.setItem(ROLE_STORAGE_KEY, user.role);
        localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(user));
        const target = new URL(safeNext(), location.href);
        target.searchParams.delete("role");
        target.searchParams.delete("user");
        location.href = safeNext();
      }

      function showPanel(mode, role = roleSelect.value) {
        activeMode = mode;
        activeRole = isMobileApk ? "public" : role;
        roleSelect.value = activeRole;
        authOverlay.classList.add("visible");
        authOverlay.setAttribute("aria-hidden", "false");
        authPanel.classList.add("visible");
        panelTitle.textContent = `${titleCase(mode)} as ${titleCase(role)} User`;
        submitBtn.textContent = mode === "login" ? "Login" : "Sign up";
        switchModeBtn.textContent = mode === "login" ? "Sign up" : "Login";
        password.autocomplete = mode === "login" ? "current-password" : "new-password";
        setStatus("");
        username.focus();
      }

      async function fetchAccount(role, name) {
        const demoExternalId = DEMO_ACCOUNTS[role]?.[name] || null;
        const selectFull = "select=external_id,username,password_hash,display_name,role,organization,persona_hint,public_persona_type,demographic_profile,metadata,is_active";
        let r = await fetch(`${SB_URL}/rest/v1/app_users?${selectFull}&role=eq.${encodeURIComponent(role)}&username=eq.${encodeURIComponent(name)}&is_active=eq.true&limit=1`, { headers: headers() });
        if (r.ok) {
          const rows = await r.json();
          if (rows[0]) return rows[0];
        }
        if (demoExternalId) {
          r = await fetch(`${SB_URL}/rest/v1/app_users?${selectFull}&external_id=eq.${encodeURIComponent(demoExternalId)}&is_active=eq.true&limit=1`, { headers: headers() });
          if (r.ok) {
            const rows = await r.json();
            if (rows[0]) return rows[0];
          }
        }
        r = await fetch(`${SB_URL}/rest/v1/app_users?select=external_id,display_name,role,organization,persona_hint,metadata,is_active&role=eq.${encodeURIComponent(role)}&is_active=eq.true`, { headers: headers() });
        if (!r.ok) throw new Error("login failed");
        const rows = await r.json();
        return rows.find((u) =>
          slug(u.metadata?.username || "") === name ||
          slug(u.external_id || "") === name ||
          (demoExternalId && u.external_id === demoExternalId),
        );
      }

      async function login(usernameValue, passwordValue) {
        const name = slug(usernameValue);
        const user = await fetchAccount(activeRole, name);
        if (!user) throw new Error("account not found");
        const hashed = await sha256(passwordValue);
        const storedHash = user.password_hash || user.metadata?.password_hash;
        const demoPassword = activeRole === "authority" ? "demo-password-authority" : "demo-password-public";
        if (storedHash) {
          if (storedHash !== hashed && storedHash !== passwordValue) throw new Error("wrong password");
        } else if (passwordValue !== demoPassword) {
          throw new Error("wrong password");
        }
        user.username ||= user.metadata?.username;
        delete user.password_hash;
        enter(user);
      }

      async function signup(usernameValue, passwordValue) {
        const name = slug(usernameValue);
        if (!name) throw new Error("username required");
        const hashed = await sha256(passwordValue);
        const row = {
          external_id: `${activeRole}_${name.replace(/[^a-z0-9]+/g, "_")}_${Date.now()}`,
          username: name,
          password_hash: hashed,
          display_name: name,
          role: activeRole,
          organization: activeRole === "authority" ? "Authority user" : "Public user",
          persona_hint: activeRole === "public" ? "working_adult_commuter" : null,
          public_persona_type: activeRole === "public" ? "working_adult_commuter" : null,
          demographic_profile: activeRole === "public" ? { persona_type: "working_adult_commuter", age_band: "25-64", mobility_needs: [], assistive_device: "none", setup_status: "default_on_signup" } : {},
          is_active: true,
          metadata: { self_signup: true, username: name, password_hash: hashed, persona_type: activeRole === "public" ? "working_adult_commuter" : null },
        };
        let r = await fetch(`${SB_URL}/rest/v1/app_users`, {
          method: "POST",
          headers: headers({ "Content-Type": "application/json", Prefer: "return=representation" }),
          body: JSON.stringify(row),
        });
        if (!r.ok) {
          const message = await r.text();
          if (message.includes("password_hash") || message.includes("username") || message.includes("public_persona_type") || message.includes("demographic_profile")) {
            delete row.password_hash;
            delete row.username;
            delete row.public_persona_type;
            delete row.demographic_profile;
            r = await fetch(`${SB_URL}/rest/v1/app_users`, {
              method: "POST",
              headers: headers({ "Content-Type": "application/json", Prefer: "return=representation" }),
              body: JSON.stringify(row),
            });
          } else {
            throw new Error(message || "signup failed");
          }
        }
        if (!r.ok) throw new Error((await r.text()) || "signup failed");
        const user = (await r.json())[0] || row;
        user.username ||= user.metadata?.username || name;
        delete user.password_hash;
        enter(user);
      }

      async function publicGoogleLogin() {
        roleSelect.value = "public";
        activeRole = "public";
        setStatus("Opening Google sign in…");
        const redirectTo = new URL("../login/", location.href);
        redirectTo.searchParams.set("oauth", "public");
        redirectTo.searchParams.set("next", safeNext());
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: redirectTo.href,
            queryParams: { access_type: "offline", prompt: "select_account" },
          },
        });
        if (!error) return;
        setStatus("Google OAuth is not enabled yet; using the temporary demo public account…");
        const user = {
          external_id: "google_public_demo",
          username: "google.public.demo",
          display_name: "Google public demo user",
          role: "public",
          organization: "Google account demo",
          persona_hint: "visually_impaired_commuter",
          public_persona_type: "visually_impaired_commuter",
          demographic_profile: { persona_type: "visually_impaired_commuter", age_band: "25-64", mobility_needs: ["low vision", "tactile guidance"] },
          is_active: true,
          metadata: { google_demo: true, username: "google.public.demo", persona_type: "visually_impaired_commuter" },
        };
        try {
          let r = await fetch(`${SB_URL}/rest/v1/app_users?on_conflict=external_id`, {
            method: "POST",
            headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" }),
            body: JSON.stringify(user),
          });
          if (!r.ok) {
            delete user.username;
            delete user.public_persona_type;
            delete user.demographic_profile;
            r = await fetch(`${SB_URL}/rest/v1/app_users?on_conflict=external_id`, {
              method: "POST",
              headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" }),
              body: JSON.stringify(user),
            });
          }
          if (r.ok) return enter((await r.json())[0] || user);
        } catch (e) {
          console.warn("Google demo account save failed", e);
        }
        enter(user);
      }

      async function finishGoogleLogin() {
        if (params.get("oauth") !== "public") return;
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session?.user) return setStatus(error?.message || "Google sign in failed", "err");
        const authUser = data.session.user;
        const email = authUser.email || `${authUser.id}@google.local`;
        const user = {
          external_id: `google_${authUser.id}`,
          username: email.toLowerCase(),
          display_name: authUser.user_metadata?.full_name || authUser.user_metadata?.name || email,
          role: "public",
          organization: "Google account",
          auth_user_id: authUser.id,
          persona_hint: "working_adult_commuter",
          public_persona_type: "working_adult_commuter",
          demographic_profile: { persona_type: "working_adult_commuter", age_band: "25-64", mobility_needs: [] },
          is_active: true,
          metadata: { google_oauth: true, username: email.toLowerCase(), avatar_url: authUser.user_metadata?.avatar_url || null, persona_type: "working_adult_commuter" },
        };
        let r = await fetch(`${SB_URL}/rest/v1/app_users?on_conflict=external_id`, {
          method: "POST",
          headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" }),
          body: JSON.stringify(user),
        });
        if (!r.ok) {
          const message = await r.text();
          if (message.includes("auth_user_id") || message.includes("username") || message.includes("public_persona_type") || message.includes("demographic_profile")) {
            delete user.auth_user_id;
            delete user.username;
            delete user.public_persona_type;
            delete user.demographic_profile;
            r = await fetch(`${SB_URL}/rest/v1/app_users?on_conflict=external_id`, {
              method: "POST",
              headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" }),
              body: JSON.stringify(user),
            });
          } else {
            return setStatus(message || "Google account save failed", "err");
          }
        }
        if (!r.ok) return setStatus((await r.text()) || "Google account save failed", "err");
        enter((await r.json())[0] || user);
      }

      openLoginBtn.onclick = () => showPanel("login");
      openSignupBtn.onclick = () => showPanel("signup");
      roleSelect.onchange = () => { activeRole = isMobileApk ? "public" : roleSelect.value; roleSelect.value = activeRole; };
      switchModeBtn.onclick = () => showPanel(activeMode === "login" ? "signup" : "login", activeRole);
      backBtn.onclick = () => { authOverlay.classList.remove("visible"); authOverlay.setAttribute("aria-hidden", "true"); authPanel.classList.remove("visible"); setStatus(""); };
      authOverlay.addEventListener("click", (event) => { if (event.target === authOverlay) backBtn.click(); });
      googlePublicBtn.onclick = () => { roleSelect.value = "public"; activeRole = "public"; publicGoogleLogin(); };
      authForm.onsubmit = async (event) => {
        event.preventDefault();
        setStatus(activeMode === "login" ? "Logging in…" : "Signing up…");
        try {
          if (activeMode === "login") await login(username.value, password.value);
          else await signup(username.value, password.value);
        } catch (e) {
          setStatus(e.message || String(e), "err");
        }
      };
      finishGoogleLogin();
    </script>
