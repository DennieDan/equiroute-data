<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <link rel="apple-touch-icon" href="../assets/jalanlens-icon-192.png" />
    <title>About Us | JalanLens</title>
    <link rel="stylesheet" href="../harvard.css?v=20260731l" />
    <style>
      :root {
        --page-bg: #f3f3f1;
        --ink: #111111;
        --muted: #4a5563;
        --line: rgba(30, 30, 30, 0.22);
        --crimson: #a51c30;
        --black: #1e1e1e;
        --serif: 'Libre Baskerville', Baskerville, Georgia, serif;
        --sans: 'Source Sans 3', Arial, Helvetica, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--ink);
        font-family: var(--sans);
      }
      .about-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: stretch;
        min-height: 72px;
        background: var(--black);
        border-bottom: 4px solid var(--crimson);
        color: #fff;
      }
      .about-mark {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        border-right: 1px solid rgba(255,255,255,0.18);
        font-weight: 900;
      }
      .about-mark::before {
        content: '';
        width: 21px;
        height: 32px;
        background: var(--crimson);
        clip-path: polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
      }
      .about-nav { display: flex; align-items: stretch; margin-left: auto; }
      .about-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 72px;
        padding: 0 24px;
        border-left: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        font-weight: 900;
        text-decoration: none;
      }
      .about-nav a:hover { background: var(--crimson); }
      main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 124px 0 72px; }
      .eyebrow {
        margin: 0 0 20px;
        color: var(--crimson);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 26px;
        align-items: start;
        padding: 0 clamp(24px, 5vw, 84px) 44px;
        border-bottom: 4px solid var(--black);
      }
      h1 {
        margin: 0;
        max-width: 860px;
        font-family: var(--serif);
        font-size: clamp(56px, 10vw, 118px);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.055em;
      }
      .hero .eyebrow,
      .hero h1,
      .hero > p {
        opacity: 0;
        transform: translate3d(-34px, 22px, 0) scale(0.985);
        filter: blur(7px);
        animation: aboutFlyIn 0.9s cubic-bezier(.16, 1, .3, 1) forwards;
      }
      .hero .eyebrow { animation-delay: 0.06s; }
      .hero h1 { animation-delay: 0.18s; }
      .hero > p { animation-delay: 0.34s; }
      .hero p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
        font-size: clamp(18px, 2.5vw, 24px);
        line-height: 1.35;
      }
      @keyframes aboutFlyIn {
        0% { opacity: 0; transform: translate3d(-34px, 22px, 0) scale(0.985); filter: blur(7px); }
        62% { opacity: 1; }
        100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero .eyebrow,
        .hero h1,
        .hero > p {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      .portrait-wrap img.dan-photo {
        object-position: center 44%;
      }
      .portrait-wrap img.abel-photo {
        object-position: center 34%;
      }
      .portrait-wrap img.hagen-photo {
        object-position: center 42%;
      }
      .portrait-wrap img.saw-photo {
        object-position: center 38%;
      }
      .team-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1px;
        margin-top: 42px;
        border-top: 1px solid var(--black);
        border-bottom: 1px solid var(--black);
        background: var(--black);
      }
      .person-card {
        background: #fff;
      }
      .person-card figure { margin: 0; }
      .portrait-wrap {
        aspect-ratio: 4 / 5;
        width: 100%;
        overflow: hidden;
        background: #ddd;
      }
      .portrait-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      figcaption {
        min-height: 146px;
        padding: 20px 18px 24px;
        border-top: 6px solid var(--crimson);
      }
      figcaption h2 {
        margin: 0 0 10px;
        font-family: var(--serif);
        font-size: clamp(24px, 2.8vw, 34px);
        font-weight: 400;
        line-height: 1.05;
      }
      figcaption p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        font-weight: 700;
        line-height: 1.35;
      }
      .note {
        margin-top: 28px;
        padding: 18px 20px;
        border-left: 6px solid var(--crimson);
        background: #fff;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }
      @media (max-width: 1040px) {
        .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .hero { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .about-header { flex-wrap: wrap; }
        .about-mark { width: 100%; min-height: 62px; }
        .about-nav { width: 100%; }
        .about-nav a { flex: 1; justify-content: center; min-height: 54px; }
        main { width: min(100% - 24px, 1180px); padding-top: 32px; }
        .team-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="../" aria-label="JalanLens home">
        <img src="../assets/jalanlens-logo.png" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="../about/" aria-current="page">About Us</a>
        <a href="../login/">Log In</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">About the team</p>
          <h1 id="pageTitle">Meet the JalanLens team</h1>
        </div>
        <p>
          A five-person computer science team building a civic accessibility demo for Huawei Tech4City, combining geospatial interfaces, street-view evidence, and persona-aware mobility scoring.
        </p>
      </section>

      <section class="team-grid" aria-label="Team members">
        <article class="person-card">
          <figure>
            <div class="portrait-wrap"><img src="../assets/team/xinyi.svg" alt="Portrait placeholder for Xinyi" /></div>
            <figcaption><h2>Xinyi</h2><p>NUS Year 4 CS</p></figcaption>
          </figure>
        </article>
        <article class="person-card">
          <figure>
            <div class="portrait-wrap"><img class="dan-photo" src="../assets/team/dan.jpg?v=20260731" alt="Dan wearing sunglasses in a green park" /></div>
            <figcaption><h2>Dan</h2><p>NUS Year 4 CS</p></figcaption>
          </figure>
        </article>
        <article class="person-card">
          <figure>
            <div class="portrait-wrap"><img class="abel-photo" src="../assets/team/abel.jpg" alt="Abel standing on a wood-panelled staircase" /></div>
            <figcaption><h2>Abel</h2><p>SMU Year 1 CS</p></figcaption>
          </figure>
        </article>
        <article class="person-card">
          <figure>
            <div class="portrait-wrap"><img class="hagen-photo" src="../assets/team/hagen.jpg" alt="Hagen flying a drone outdoors" /></div>
            <figcaption><h2>Hagen</h2><p>SMU Year 2 CS</p></figcaption>
          </figure>
        </article>
        <article class="person-card">
          <figure>
            <div class="portrait-wrap"><img class="saw-photo" src="../assets/team/saw.jpg" alt="Saw team member headshot" /></div>
            <figcaption><h2>Saw</h2><p>SIM Year 2 CS</p></figcaption>
          </figure>
        </article>
      </section>

    </main>
  </body>
</html>
