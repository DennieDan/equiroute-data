<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <link rel="apple-touch-icon" href="../assets/jalanlens-icon-192.png" />
    <title>Profile | JalanLens</title>
    <link rel="stylesheet" href="../harvard.css?v=20260731h" />
    <style>
      :root {
        --page-bg: #f3f3f1;
        --ink: #111111;
        --muted: #4a5563;
        --line: rgba(30,30,30,0.2);
        --crimson: #a51c30;
        --black: #1e1e1e;
        --white: #ffffff;
        --serif: 'Libre Baskerville', Baskerville, Georgia, serif;
        --sans: 'Source Sans 3', Arial, Helvetica, sans-serif;
      }
      * { box-sizing: border-box; }
      body.profile-page {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(243,243,241,0.96), rgba(243,243,241,1)),
          var(--page-bg);
        color: var(--ink);
        font-family: var(--sans);
      }
      .profile-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 124px 0 72px;
      }
      .profile-hero {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(360px, 0.72fr);
        gap: clamp(28px, 5vw, 72px);
        align-items: start;
      }
      .profile-intro {
        padding-bottom: 36px;
        border-bottom: 4px solid var(--black);
      }
      .profile-logo {
        width: 150px;
        height: auto;
        display: block;
        margin-bottom: 32px;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--crimson);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 760px;
        font-family: var(--serif);
        font-size: clamp(64px, 11vw, 126px);
        font-weight: 400;
        line-height: 0.88;
        letter-spacing: -0.065em;
        color: var(--ink);
      }
      #summary {
        max-width: 680px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(18px, 2.2vw, 24px);
        line-height: 1.35;
      }
      .profile-card {
        border-top: 6px solid var(--crimson);
        border-bottom: 1px solid var(--black);
        background: rgba(255,255,255,0.88);
        padding: clamp(24px, 4vw, 40px);
        box-shadow: 0 18px 48px rgba(0,0,0,0.12);
      }
      .profile-card h2 {
        margin: 0 0 18px;
        font-family: var(--serif);
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 16px;
      }
      .field-full { grid-column: 1 / -1; }
      label {
        display: block;
        margin: 0;
        color: var(--black);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      input, select {
        width: 100%;
        margin-top: 7px;
        padding: 12px 13px;
        border: 1px solid rgba(30,30,30,0.24);
        border-left: 4px solid var(--crimson);
        border-radius: 0;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        font-weight: 750;
      }
      input::placeholder { color: #64748b; }
      select { appearance: auto; }
      input:focus, select:focus {
        outline: 2px solid rgba(165,28,48,0.22);
        outline-offset: 2px;
        border-color: var(--black);
        border-left-color: var(--crimson);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 22px;
      }
      button, a.profile-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid var(--black);
        border-radius: 0;
        padding: 10px 14px;
        background: var(--black);
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--crimson);
        border-color: var(--crimson);
        grid-column: 1 / -1;
      }
      a.profile-button.secondary,
      button.secondary {
        background: #ffffff;
        color: var(--black);
        border-color: rgba(30,30,30,0.28);
      }
      button:hover, a.profile-button:hover {
        background: var(--crimson);
        border-color: var(--crimson);
        color: #ffffff;
      }
      #status {
        min-height: 20px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }
      #status.ok { color: #166534; }
      #status.err { color: #b91c1c; }
      @media (max-width: 860px) {
        .profile-shell { width: min(100% - 28px, 720px); padding-top: 140px; }
        .profile-hero { grid-template-columns: 1fr; }
        .profile-logo { width: 132px; }
        .form-grid, .actions { grid-template-columns: 1fr; }
        button.primary { grid-column: auto; }
      }
    </style>
  </head>
  <body class="profile-page">
    <header class="site-nav" aria-label="JalanLens site navigation">
      <a class="site-logo" href="../" aria-label="JalanLens home">
        <img src="../assets/jalanlens-logo.svg" alt="" />
        <span>JalanLens</span>
      </a>
      <nav class="site-links" aria-label="Primary">
        <a href="../about/">About Us</a>
        <a href="../login/">Log In</a>
      </nav>
    </header>
    <main class="profile-shell">
      <section class="profile-hero" aria-labelledby="profileTitle">
        <div class="profile-intro">
          <img class="profile-logo" src="../assets/jalanlens-logo.svg" alt="" />
          <p class="eyebrow">JalanLens account</p>
          <h1 id="profileTitle">Profile</h1>
          <p id="summary">Loading current database user…</p>
        </div>
        <section class="profile-card" aria-label="Edit account profile">
          <h2>Account details</h2>
          <form id="profileForm">
            <div class="form-grid">
              <label for="displayName">Display name
                <input id="displayName" name="displayName" required maxlength="120" />
              </label>
              <label for="username">Username
                <input id="username" name="username" required maxlength="80" autocomplete="username" />
              </label>
              <label for="password" class="field-full">New password
                <input id="password" name="password" type="password" minlength="4" autocomplete="new-password" placeholder="leave blank to keep current password" />
              </label>
              <label for="personaType" class="field-full">Accessibility persona / demographic profile
                <select id="personaType" name="personaType">
                  <option value="working_adult_commuter">Working adult commuter</option>
                  <option value="older_resident_cane">Older resident with cane</option>
                  <option value="older_resident_walker">Older resident with walker</option>
                  <option value="wheelchair_user_commuter">Wheelchair user commuter</option>
                  <option value="visually_impaired_commuter">Visually impaired commuter</option>
                  <option value="pma_pmd_user">PMA / PMD user</option>
                  <option value="caregiver_with_disabled_person">Caregiver with disabled person</option>
                  <option value="parent_with_stroller">Parent with stroller</option>
                  <option value="primary_school_child">Primary school child</option>
                  <option value="secondary_student">Secondary student</option>
                  <option value="poly_uni_student">Poly / university student</option>
                  <option value="delivery_rider_worker">Delivery / service worker</option>
                </select>
              </label>
              <label for="ageBand">Age band
                <input id="ageBand" name="ageBand" maxlength="40" placeholder="e.g. 25-64" />
              </label>
              <label for="mobilityNeeds">Mobility/accessibility notes
                <input id="mobilityNeeds" name="mobilityNeeds" maxlength="180" placeholder="e.g. wheelchair, stroller, low vision" />
              </label>
            </div>
            <div class="actions">
              <button class="primary" type="submit">Save profile</button>
              <a class="profile-button secondary" id="backLink" href="../street-intelligence/">Back to dashboard</a>
              <button class="secondary" id="logoutBtn" type="button">Log out</button>
            </div>
          </form>
          <div id="status"></div>
        </section>
      </section>
    </main>
    <script type="module">
      import { sha256 } from "../sha256.js";

      const SUPABASE_URL = "https://khddsjemkdcgumfvkraa.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_lqGtwkNAOMV7qsYPKVZr8w_GytZx3Qm";
      const ROLE_STORAGE_KEY = "jalanlens_role";
      const USER_STORAGE_KEY = "jalanlens_user";
      const LEGACY_ROLE_STORAGE_KEY = "access" + "twin_role";
      const LEGACY_USER_STORAGE_KEY = "access" + "twin_user";
      const params = new URLSearchParams(location.search);
      let stored = null;
      try {
        stored = JSON.parse(localStorage.getItem(USER_STORAGE_KEY) || localStorage.getItem(LEGACY_USER_STORAGE_KEY) || "null");
      } catch (e) {
        stored = null;
      }
      const role = stored?.role || localStorage.getItem(ROLE_STORAGE_KEY) || localStorage.getItem(LEGACY_ROLE_STORAGE_KEY) || "";
      const externalId = stored?.external_id || "";
      const headers = (extra = {}) => ({ apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`, ...extra });
      const setStatus = (msg, kind = "") => { status.textContent = msg; status.className = kind; };
      async function loadUser() {
        if (!stored || !externalId || !role) {
          localStorage.removeItem(ROLE_STORAGE_KEY);
          localStorage.removeItem(USER_STORAGE_KEY);
          location.replace("../?next=profile/");
          throw new Error("JalanLens login required");
        }
        let user = stored;
        try {
          let r = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=external_id,username,display_name,role,organization,persona_hint,public_persona_type,demographic_profile,metadata,is_active&external_id=eq.${encodeURIComponent(externalId)}&limit=1`, { headers: headers() });
          if (!r.ok) {
            r = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=external_id,display_name,role,organization,persona_hint,metadata,is_active&external_id=eq.${encodeURIComponent(externalId)}&limit=1`, { headers: headers() });
          }
          if (r.ok) user = (await r.json())[0] || user;
        } catch (e) {}
        user.role ||= role;
        user.username ||= user.external_id || "demo_user";
        user.display_name ||= user.username;
        localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(user));
        localStorage.setItem(ROLE_STORAGE_KEY, user.role);
        displayName.value = user.display_name;
        username.value = user.username;
        const demoProfile = user.demographic_profile || user.metadata?.demographic_profile || {};
        personaType.value = user.public_persona_type || user.persona_hint || user.metadata?.persona_type || demoProfile.persona_type || "working_adult_commuter";
        ageBand.value = demoProfile.age_band || "";
        mobilityNeeds.value = Array.isArray(demoProfile.mobility_needs) ? demoProfile.mobility_needs.join(", ") : (demoProfile.mobility_needs || "");
        summary.textContent = `${user.role === "authority" ? "Authority" : "Public"} account · ${user.organization || "JalanLens demo"}`;
        backLink.href = "../street-intelligence/";
        return user;
      }
      let currentUser = null;
      loadUser().then((u) => { currentUser = u; });
      profileForm.onsubmit = async (event) => {
        event.preventDefault();
        if (!currentUser?.external_id) return setStatus("No current database user selected. Log in again first.", "err");
        setStatus("Saving profile…");
        const profile = {
          persona_type: personaType.value,
          age_band: ageBand.value.trim(),
          mobility_needs: mobilityNeeds.value.split(",").map((x) => x.trim()).filter(Boolean),
          updated_from_profile: true,
        };
        const next = {
          display_name: displayName.value.trim(),
          username: username.value.trim(),
          persona_hint: personaType.value,
          public_persona_type: currentUser.role === "public" ? personaType.value : null,
          demographic_profile: profile,
          metadata: { ...(currentUser.metadata || {}), persona_type: personaType.value, demographic_profile: profile },
          updated_at: new Date().toISOString(),
        };
        if (password.value) next.password_hash = await sha256(password.value);
        try {
          const r = await fetch(`${SUPABASE_URL}/rest/v1/app_users?external_id=eq.${encodeURIComponent(currentUser.external_id)}`, {
            method: "PATCH",
            headers: headers({ "Content-Type": "application/json", Prefer: "return=representation" }),
            body: JSON.stringify(next),
          });
          if (!r.ok) throw new Error(await r.text());
          const rows = await r.json();
          currentUser = { ...currentUser, ...(rows[0] || next) };
          localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(currentUser));
          password.value = "";
          setStatus("Profile saved to Supabase app_users.", "ok");
        } catch (e) {
          currentUser = { ...currentUser, ...next };
          localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(currentUser));
          setStatus(`Saved locally, but Supabase update failed: ${e.message || e}`, "err");
        }
      };
      logoutBtn.onclick = () => {
        localStorage.removeItem(ROLE_STORAGE_KEY);
        localStorage.removeItem(USER_STORAGE_KEY);
        localStorage.removeItem(LEGACY_ROLE_STORAGE_KEY);
        localStorage.removeItem(LEGACY_USER_STORAGE_KEY);
        location.href = "../";
      };
    </script>
  </body>
</html>
